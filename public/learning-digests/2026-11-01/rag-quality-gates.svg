<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 410" role="img" aria-label="Three gates for a trustworthy answer">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#edf5ff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#7186a0"/></marker></defs><rect width="1220" height="410" rx="23" fill="url(#bg)"/>
<text x="36" y="52" font-size="29" font-weight="700" font-family="Arial,Noto Sans SC,sans-serif" fill="#18375c">Three gates for a trustworthy answer</text>
<text x="36" y="83" font-size="15" font-family="Arial,Noto Sans SC,sans-serif" fill="#5d728d">Debug retrieval, citation support, and answer correctness separately</text><rect x="32" y="141" width="277" height="173" rx="16" fill="#e6f2fc" stroke="#78abd0" stroke-width="2"/><circle cx="170.5" cy="171" r="18" fill="#fff" stroke="#78abd0" stroke-width="2"/><text x="170.5" y="177" text-anchor="middle" font-size="16" font-weight="700" fill="#304b70">1</text><text x="170.5" y="220" text-anchor="middle" font-size="19" font-weight="700" fill="#234468" font-family="Arial,Noto Sans SC,sans-serif">Hit@k</text><text x="170.5" y="248" text-anchor="middle" font-size="13" fill="#5b7087" font-family="Arial,Noto Sans SC,sans-serif">Did the search</text><text x="170.5" y="269" text-anchor="middle" font-size="13" fill="#5b7087" font-family="Arial,Noto Sans SC,sans-serif">find relevant text?</text><rect x="325" y="141" width="277" height="173" rx="16" fill="#e7f7f0" stroke="#70b69b" stroke-width="2"/><circle cx="463.5" cy="171" r="18" fill="#fff" stroke="#70b69b" stroke-width="2"/><text x="463.5" y="177" text-anchor="middle" font-size="16" font-weight="700" fill="#304b70">2</text><text x="463.5" y="220" text-anchor="middle" font-size="19" font-weight="700" fill="#234468" font-family="Arial,Noto Sans SC,sans-serif">Citation</text><text x="463.5" y="248" text-anchor="middle" font-size="13" fill="#5b7087" font-family="Arial,Noto Sans SC,sans-serif">Is the referenced</text><text x="463.5" y="269" text-anchor="middle" font-size="13" fill="#5b7087" font-family="Arial,Noto Sans SC,sans-serif">passage really there?</text><rect x="618" y="141" width="277" height="173" rx="16" fill="#fff4df" stroke="#e3b46d" stroke-width="2"/><circle cx="756.5" cy="171" r="18" fill="#fff" stroke="#e3b46d" stroke-width="2"/><text x="756.5" y="177" text-anchor="middle" font-size="16" font-weight="700" fill="#304b70">3</text><text x="756.5" y="220" text-anchor="middle" font-size="19" font-weight="700" fill="#234468" font-family="Arial,Noto Sans SC,sans-serif">Support</text><text x="756.5" y="248" text-anchor="middle" font-size="13" fill="#5b7087" font-family="Arial,Noto Sans SC,sans-serif">Does it justify</text><text x="756.5" y="269" text-anchor="middle" font-size="13" fill="#5b7087" font-family="Arial,Noto Sans SC,sans-serif">this exact claim?</text><rect x="911" y="141" width="277" height="173" rx="16" fill="#f1ecff" stroke="#aaa2d6" stroke-width="2"/><circle cx="1049.5" cy="171" r="18" fill="#fff" stroke="#aaa2d6" stroke-width="2"/><text x="1049.5" y="177" text-anchor="middle" font-size="16" font-weight="700" fill="#304b70">4</text><text x="1049.5" y="220" text-anchor="middle" font-size="19" font-weight="700" fill="#234468" font-family="Arial,Noto Sans SC,sans-serif">Correctness</text><text x="1049.5" y="248" text-anchor="middle" font-size="13" fill="#5b7087" font-family="Arial,Noto Sans SC,sans-serif">Are conclusions</text><text x="1049.5" y="269" text-anchor="middle" font-size="13" fill="#5b7087" font-family="Arial,Noto Sans SC,sans-serif">within scope?</text><path d="M312 228H322" stroke="#7186a0" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow)" fill="none"/><path d="M605 228H615" stroke="#7186a0" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow)" fill="none"/><path d="M898 228H908" stroke="#7186a0" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow)" fill="none"/>
<rect x="36" y="336" width="1148" height="42" rx="15" fill="#fff" stroke="#dbe7f3"/><text x="610" y="363" text-anchor="middle" font-size="15" fill="#5a6f87" font-family="Arial,Noto Sans SC,sans-serif">A real URL is necessary for verification, but never sufficient for correctness</text>
</svg>