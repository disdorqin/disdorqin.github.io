<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="东日本大地震导致电力和供应链中断，并通过工业生产、燃料进口等路径影响贸易和经济；非单一因果估计">
<rect width="1200" height="620" rx="28" fill="#112239"/><text x="55" y="68" font-size="30" font-weight="700" font-family="sans-serif" fill="#f5f9ff">2011 年冲击：不是一张贸易逆差表能概括的灾害</text><text x="57" y="109" font-size="16" font-family="sans-serif" fill="#bbcee1">原生灾害 → 物理系统中断 → 企业生产与能源替代 → 多渠道经济影响</text>
<g font-family="sans-serif">
<rect x="55" y="175" width="243" height="217" rx="20" fill="#4e3e45" stroke="#b98d93" stroke-width="2"/><text x="78" y="222" font-size="21" font-weight="700" fill="#ffd3d8">01 地震与海啸</text><text x="78" y="268" font-size="18" fill="#f8eaed">2011 年 3 月 11 日</text><text x="78" y="305" font-size="17" fill="#eed1d6">人员与设施受损</text><text x="78" y="340" font-size="17" fill="#eed1d6">福岛核事故</text>
<rect x="336" y="175" width="243" height="217" rx="20" fill="#4d4939" stroke="#cdb584" stroke-width="2"/><text x="359" y="222" font-size="21" font-weight="700" fill="#ffeca9">02 供给约束</text><text x="359" y="268" font-size="18" fill="#f9edd4">电力供应不足</text><text x="359" y="305" font-size="17" fill="#ebdfb9">关键零部件停产</text><text x="359" y="340" font-size="17" fill="#ebdfb9">运输与物流受限</text>
<rect x="617" y="175" width="243" height="217" rx="20" fill="#2b4e5f" stroke="#82b1ca" stroke-width="2"/><text x="640" y="222" font-size="21" font-weight="700" fill="#bcecff">03 调整与替代</text><text x="640" y="268" font-size="18" fill="#ecf8ff">工业生产与出口降</text><text x="640" y="305" font-size="17" fill="#c5e1ef">火电替代部分核电</text><text x="640" y="340" font-size="17" fill="#c5e1ef">LNG 进口增</text>
<rect x="899" y="175" width="246" height="217" rx="20" fill="#2e5146" stroke="#82bba1" stroke-width="2"/><text x="922" y="222" font-size="21" font-weight="700" fill="#c7f5dc">04 多种经济结果</text><text x="922" y="268" font-size="18" fill="#e8fff5">企业与就业受扰动</text><text x="922" y="305" font-size="17" fill="#c4e5d1">进口能源成本变化</text><text x="922" y="340" font-size="17" fill="#c4e5d1">贸易与收入项变动</text></g>
<g stroke="#879db1" stroke-width="4"><line x1="300" y1="279" x2="330" y2="279"/><line x1="581" y1="279" x2="611" y2="279"/><line x1="862" y1="279" x2="892" y2="279"/></g><g fill="#879db1"><path d="M327 270 l10 9 -10 9z"/><path d="M608 270 l10 9 -10 9z"/><path d="M889 270 l10 9 -10 9z"/></g>
<rect x="55" y="446" width="1090" height="117" rx="17" fill="#203851"/><text x="82" y="483" font-size="21" font-weight="700" font-family="sans-serif" fill="#f5faff">灾害的 GDP、财富与福利净损失 ≠ 某月贸易余额变化</text><text x="82" y="519" font-size="16" font-family="sans-serif" fill="#c5daed">需要同口径反事实：没有灾害时各项生产、进口、重建和长期治理会如何变化？</text>
<text x="1139" y="599" text-anchor="end" font-size="13" font-family="sans-serif" fill="#8fa8bf">原创机制图｜IAEA 2011 · BOJ 2011 · EIA 2013 · IMF 2011</text>
</svg>