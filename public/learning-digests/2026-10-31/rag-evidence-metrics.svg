<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 520"><rect width="1050" height="520" fill="#f8faff"/><text x="50" y="57" font-family="sans-serif" fill="#213851" font-size="31" font-weight="bold">检索覆盖与回答正确是两种不同指标</text><text x="50" y="92" font-family="sans-serif" fill="#67778c" font-size="18">以下 20 题纯属教学构造；不是实际系统测评</text><g font-family="sans-serif"><rect x="60" y="144" width="930" height="67" rx="10" fill="#dfe8f3"/><rect x="60" y="144" width="697.5" height="67" rx="10" fill="#8bb9ef"/><text x="75" y="184" font-size="20" fill="#163b66">找到充分证据 15 / 20 = 75%</text><rect x="60" y="260" width="930" height="67" rx="10" fill="#dfe8f3"/><rect x="60" y="260" width="604.5" height="67" rx="10" fill="#83c99a"/><text x="75" y="300" font-size="20" fill="#245438">最后答对 13 / 20 = 65%</text><rect x="60" y="372" width="930" height="72" rx="14" fill="#fff0d4"/><text x="85" y="414" font-size="21" fill="#755529">缺证据的 5 题仍可能碰巧猜对 1 题；猜对不意味着证据链可靠。</text></g></svg>