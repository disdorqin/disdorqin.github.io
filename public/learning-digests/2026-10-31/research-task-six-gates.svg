<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 560"><rect width="1050" height="560" fill="#f8fafc"/><text x="55" y="65" font-family="sans-serif" font-size="31" fill="#1f3852" font-weight="bold">一次可审核研究任务的六个检查点</text><g font-family="sans-serif" font-size="21" text-anchor="middle"><rect x="60" y="132" width="277" height="94" rx="16" fill="#e1eaff" stroke="#88a6dc" stroke-width="2"/><text x="198" y="174" fill="#305b99">1. 用户目标与权限</text><text x="198" y="202" font-size="16" fill="#496d9e">公开来源 / 不越权</text><rect x="388" y="132" width="277" height="94" rx="16" fill="#e1eaff" stroke="#88a6dc" stroke-width="2"/><text x="526" y="174" fill="#305b99">2. 文献身份与版本</text><text x="526" y="202" font-size="16" fill="#496d9e">原文 / 段落 / 可回读</text><rect x="716" y="132" width="277" height="94" rx="16" fill="#e1eaff" stroke="#88a6dc" stroke-width="2"/><text x="855" y="174" fill="#305b99">3. 数据与实验合同</text><text x="855" y="202" font-size="16" fill="#496d9e">时间可用性 / 无泄漏</text><rect x="60" y="301" width="277" height="94" rx="16" fill="#e0f3e8" stroke="#8bbaa0" stroke-width="2"/><text x="198" y="343" fill="#286945">4. 真实小规模执行</text><text x="198" y="371" font-size="16" fill="#4b8062">日志 / 错误 / 文件</text><rect x="388" y="301" width="277" height="94" rx="16" fill="#e0f3e8" stroke="#8bbaa0" stroke-width="2"/><text x="526" y="343" fill="#286945">5. 独立指标核验</text><text x="526" y="371" font-size="16" fill="#4b8062">可比 / 反例 / 资源</text><rect x="716" y="301" width="277" height="94" rx="16" fill="#e0f3e8" stroke="#8bbaa0" stroke-width="2"/><text x="855" y="343" fill="#286945">6. 结论与知识卡</text><text x="855" y="371" font-size="16" fill="#4b8062">范围 / 来源 / 停止条件</text></g><g fill="none" stroke="#7790a7" stroke-width="3"><path d="M337 179 H379"/><path d="M665 179 H707"/><path d="M854 226 V260 H198 V292"/><path d="M337 348 H379"/><path d="M665 348 H707"/></g><rect x="60" y="447" width="933" height="63" rx="12" fill="#fff1d7"/><text x="87" y="486" font-family="sans-serif" font-size="21" fill="#74512b">失败要在对应检查点记录，禁止把文件生成成功当作科研结论成立。</text></svg>