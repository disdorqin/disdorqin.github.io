<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620"><rect width="1080" height="620" fill="#f5f8fd"/><text x="50" y="67" font-family="sans-serif" font-size="33" font-weight="bold" fill="#203451">科研助手里的四个不同角色</text><text x="50" y="103" font-family="sans-serif" font-size="18" fill="#61738a">接口负责访问；规范负责做法；检索负责证据；执行者负责决策</text><rect x="360" y="165" width="360" height="95" rx="18" fill="#d7e7ff" stroke="#5279b4" stroke-width="3"/><text x="540" y="201" font-family="sans-serif" font-size="26" text-anchor="middle" fill="#244c80" font-weight="bold">Agent：计划与执行闭环</text><text x="540" y="235" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#385d84">观察 → 决策 → 动作 → 核验</text><g font-family="sans-serif" text-anchor="middle"><rect x="45" y="350" width="290" height="142" rx="16" fill="#def3e5" stroke="#86b49a" stroke-width="2"/><text x="190" y="392" font-size="25" fill="#27623c" font-weight="bold">MCP / 工具接口</text><text x="190" y="429" font-size="19" fill="#426c52">执行合法外部动作</text><text x="190" y="463" font-size="17" fill="#52735b">权限与参数验证</text><rect x="393" y="350" width="290" height="142" rx="16" fill="#fff0d5" stroke="#c5a067" stroke-width="2"/><text x="538" y="392" font-size="25" fill="#7d541c" font-weight="bold">Skills</text><text x="538" y="429" font-size="19" fill="#8b672d">按需读取工作规范</text><text x="538" y="463" font-size="17" fill="#997d45">条件与停止规则</text><rect x="741" y="350" width="290" height="142" rx="16" fill="#ece3fc" stroke="#a295c7" stroke-width="2"/><text x="886" y="392" font-size="25" fill="#554489" font-weight="bold">RAG</text><text x="886" y="429" font-size="19" fill="#675b8f">检索原始来源</text><text x="886" y="463" font-size="17" fill="#766b9c">证据与上下文</text></g><g fill="none" stroke="#738aa6" stroke-width="3"><path d="M450 260 L190 340"/><path d="M540 260 V340"/><path d="M630 260 L886 340"/></g><text x="48" y="565" font-family="sans-serif" font-size="21" fill="#4e6074">事实核验与权限控制必须在模型输出之外实际执行，不能由流程图代替。</text></svg>