<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">总体均值与跨时间差异</title><desc id="desc">四个虚构评价月份的配对损失差分别为正三、正一、负二、正零点五；显示均值不能概括所有环境。</desc><rect width="1200" height="640" fill="#f7fafc"/><text x="58" y="71" font-family="sans-serif" font-size="36" font-weight="bold" fill="#1d3856">一项小幅平均改进，可能隐藏反向月份</text><text x="58" y="109" font-family="sans-serif" font-size="20" fill="#6a8098">教学构造：配对损失差为正表示候选 B 误差更低，负值表示更差</text><g stroke="#8c9fb1" stroke-width="2" fill="none"><path d="M200 325 H1105"/><path d="M200 195 H1105"/><path d="M200 455 H1105"/></g><g font-family="sans-serif" font-size="18" fill="#61768c"><text x="120" y="200">+3</text><text x="120" y="330">0</text><text x="120" y="460">-3</text></g><rect x="265" y="195" width="137" height="130" rx="10" fill="#7abd98"/><rect x="495" y="282" width="137" height="43" rx="10" fill="#7abd98"/><rect x="725" y="325" width="137" height="87" rx="10" fill="#efaa87"/><rect x="955" y="303" width="137" height="22" rx="10" fill="#7abd98"/><g font-family="sans-serif" font-size="21" text-anchor="middle" fill="#28455f"><text x="334" y="487">月份 A</text><text x="564" y="487">月份 B</text><text x="794" y="487">月份 C</text><text x="1024" y="487">月份 D</text><text x="334" y="185">+3</text><text x="564" y="271">+1</text><text x="794" y="437">-2</text><text x="1024" y="291">+0.5</text></g><rect x="205" y="533" width="895" height="60" rx="14" fill="#e8edf4"/><text x="233" y="570" font-family="sans-serif" font-size="22" fill="#365873">均值 = +0.625；仅凭均值不能推断每个月都稳定改善。</text></svg>