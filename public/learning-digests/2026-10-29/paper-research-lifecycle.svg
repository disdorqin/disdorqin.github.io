<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 655" role="img" aria-labelledby="title desc"><title id="title">研究问题至论文的完整闭环</title><desc id="desc">包含问题证据、文献定位、合法基线、可证伪方法、独立实验和结论六个环节。</desc><rect width="1200" height="655" fill="#f7f9fc"/><text x="55" y="68" font-family="sans-serif" font-size="35" fill="#1b3856" font-weight="bold">论文闭环：不是把研究流程图画好看</text><text x="56" y="108" font-family="sans-serif" font-size="20" fill="#6c8196">每个阶段都需要真实产物；失败可以返回上一步修订</text><g font-family="sans-serif" text-anchor="middle"><rect x="66" y="164" width="326" height="128" rx="20" fill="#e3f0ff" stroke="#87addb" stroke-width="2"/><text x="229" y="209" font-size="25" fill="#265c96" font-weight="bold">问题证据</text><text x="229" y="249" font-size="18" fill="#5a7b9d">来源、观察与反例</text><rect x="437" y="164" width="326" height="128" rx="20" fill="#e3f0ff" stroke="#87addb" stroke-width="2"/><text x="600" y="209" font-size="25" fill="#265c96" font-weight="bold">文献差异</text><text x="600" y="249" font-size="18" fill="#5a7b9d">已有方法与适用条件</text><rect x="808" y="164" width="326" height="128" rx="20" fill="#e7f4eb" stroke="#8cc29f" stroke-width="2"/><text x="971" y="209" font-size="25" fill="#296e47" font-weight="bold">任务与基线</text><text x="971" y="249" font-size="18" fill="#5a886a">时间可用性、严格对照</text><rect x="66" y="371" width="326" height="128" rx="20" fill="#fff0de" stroke="#d8b48c" stroke-width="2"/><text x="229" y="416" font-size="25" fill="#87592c" font-weight="bold">可证伪方法</text><text x="229" y="455" font-size="18" fill="#9a7b59">明确假设与消融</text><rect x="437" y="371" width="326" height="128" rx="20" fill="#fff0de" stroke="#d8b48c" stroke-width="2"/><text x="600" y="416" font-size="25" fill="#87592c" font-weight="bold">独立实验</text><text x="600" y="455" font-size="18" fill="#9a7b59">真实日志、误差、成本</text><rect x="808" y="371" width="326" height="128" rx="20" fill="#eee8f9" stroke="#b8a9d5" stroke-width="2"/><text x="971" y="416" font-size="25" fill="#685496" font-weight="bold">论文与结论</text><text x="971" y="455" font-size="18" fill="#8774aa">主张、边界、参考文献</text></g><g stroke="#7592ac" stroke-width="3" fill="none"><path d="M392 228 H426"/><path d="M763 228 H797"/><path d="M971 292 V334 H229 V360"/><path d="M392 435 H426"/><path d="M763 435 H797"/></g><rect x="66" y="555" width="1068" height="55" rx="13" fill="#223e59"/><text x="94" y="590" font-family="sans-serif" font-size="21" font-weight="bold" fill="#fff">研究结论只可覆盖已经验证的范围；发现反例就回到假设，而非修改文字。</text></svg>