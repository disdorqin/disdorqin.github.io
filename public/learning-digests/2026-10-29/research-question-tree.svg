<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">研究问题、竞争假设与反例实验</title><desc id="desc">观察到大反转误差后，提出样本不足、损失偏好与可用信息不足三个竞争假设，逐一设计可反驳实验。</desc><rect width="1200" height="690" fill="#f6f9fd"/><rect x="48" y="35" width="1104" height="620" rx="24" fill="#fff" stroke="#e2eaf4" stroke-width="2"/><text x="77" y="95" font-family="sans-serif" fill="#193451" font-size="37" font-weight="bold">观察 ≠ 原因：研究需要竞争假设</text><text x="78" y="130" font-family="sans-serif" fill="#687c92" font-size="21">先发现可复查的失败，再设计能推翻自己的实验</text><rect x="340" y="173" width="520" height="101" rx="18" fill="#dceafd" stroke="#8faede" stroke-width="2"/><text x="600" y="215" font-size="25" font-weight="bold" font-family="sans-serif" fill="#20528c" text-anchor="middle">观察：多步预测遇到剧烈反转</text><text x="600" y="248" font-size="19" font-family="sans-serif" fill="#557aa7" text-anchor="middle">先检查时间对齐、标签与样本数量</text><g font-family="sans-serif" text-anchor="middle"><rect x="80" y="364" width="314" height="184" rx="19" fill="#e7f3eb" stroke="#95c2a4" stroke-width="2"/><text x="237" y="408" font-size="25" font-weight="bold" fill="#2b714a">H1：样本不足</text><text x="237" y="448" font-size="20" fill="#558666">增加合法历史样本</text><text x="237" y="480" font-size="19" fill="#558666">控制训练预算对照</text><rect x="443" y="364" width="314" height="184" rx="19" fill="#fff1df" stroke="#d9b687" stroke-width="2"/><text x="600" y="408" font-size="25" font-weight="bold" fill="#8a5b2c">H2：优化偏好</text><text x="600" y="448" font-size="20" fill="#9d7652">损失重加权消融</text><text x="600" y="480" font-size="19" fill="#9d7652">观察尾部与常规误差</text><rect x="806" y="364" width="314" height="184" rx="19" fill="#eee7f9" stroke="#bea8dd" stroke-width="2"/><text x="963" y="408" font-size="25" font-weight="bold" fill="#65519a">H3：信息不足</text><text x="963" y="448" font-size="20" fill="#846ab0">校验预测时可用输入</text><text x="963" y="480" font-size="19" fill="#846ab0">独立验证能否识别状态</text></g><g stroke="#7791ae" stroke-width="3" fill="none"><path d="M600 274 V319 H237 V351"/><path d="M600 319 V351"/><path d="M600 319 H963 V351"/></g><text x="90" y="615" font-family="sans-serif" font-size="21" fill="#536b82">只有证据和反例检查通过，才能将候选解释升级为研究结论。</text></svg>