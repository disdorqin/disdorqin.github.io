<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d">
<title id="t">视频证据的分层验收</title><desc id="d">媒体获取、语音与关键帧、证据覆盖、语义核验、外部验证、博客出版六个不同状态。</desc>
<rect width="1000" height="520" rx="24" fill="#f7f9fc"/>
<text x="50" y="60" fill="#172c4d" font-size="30" font-family="sans-serif" font-weight="bold">从“处理成功”到“结论可信”</text>
<text x="50" y="95" fill="#52637b" font-size="17" font-family="sans-serif">每层分别验收；下层成功不能推出上层成功</text>
<g font-family="sans-serif" font-size="19" text-anchor="middle">
<rect x="54" y="148" width="282" height="78" rx="14" fill="#dcecff" stroke="#78a8df" stroke-width="2"/>
<text x="195" y="179" fill="#173960">1. 获取公开媒体</text><text x="195" y="207" font-size="14" fill="#345e8e">访问许可 / 真实文件 / 时间戳</text>
<rect x="360" y="148" width="282" height="78" rx="14" fill="#dcecff" stroke="#78a8df" stroke-width="2"/>
<text x="501" y="179" fill="#173960">2. 提取候选证据</text><text x="501" y="207" font-size="14" fill="#345e8e">ASR / 关键帧 / OCR</text>
<rect x="666" y="148" width="282" height="78" rx="14" fill="#fff0d8" stroke="#daa452" stroke-width="2"/>
<text x="807" y="179" fill="#6b4815">3. 检查时间覆盖</text><text x="807" y="207" font-size="14" fill="#88641b">盲区 / 事件 / 可读性</text>
<rect x="54" y="292" width="282" height="78" rx="14" fill="#fff0d8" stroke="#daa452" stroke-width="2"/>
<text x="195" y="323" fill="#6b4815">4. 核验具体问题</text><text x="195" y="351" font-size="14" fill="#88641b">观察与推断分离</text>
<rect x="360" y="292" width="282" height="78" rx="14" fill="#e6f4e9" stroke="#77b686" stroke-width="2"/>
<text x="501" y="323" fill="#235a35">5. 交叉验证结论</text><text x="501" y="351" font-size="14" fill="#347747">原始视频 / 文档 / 复现</text>
<rect x="666" y="292" width="282" height="78" rx="14" fill="#e6f4e9" stroke="#77b686" stroke-width="2"/>
<text x="807" y="323" fill="#235a35">6. 发布学习文章</text><text x="807" y="351" font-size="14" fill="#347747">万字正文 / 图示 / 构建</text>
