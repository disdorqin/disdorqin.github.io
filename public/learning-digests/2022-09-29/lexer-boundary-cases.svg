<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">最长匹配与词法边界三例</title><desc id="d">ifelse识别为一个标识符；大于等于号识别为一个两字符运算符；十点点二十识别为整数、范围符、整数。</desc><rect width="1200" height="650" rx="22" fill="#f6f9fd"/><text x="60" y="78" font-family="sans-serif" font-size="36" font-weight="bold" fill="#1f3b56">三个反例，比一千个普通输入更能测出错误</text><text x="61" y="115" font-family="sans-serif" font-size="20" fill="#657e95">最长合法词素 → 同长度才用规则优先级；数值规则必须明确</text><g font-family="sans-serif"><rect x="60" y="172" width="1080" height="108" rx="16" fill="#e3eeff" stroke="#9ab5db" stroke-width="2"/><text x="92" y="217" font-size="25" font-weight="bold" fill="#315e97">输入：ifelse</text><text x="474" y="217" font-size="24" fill="#315e97">IDENT(ifelse)</text><text x="474" y="252" font-size="18" fill="#557ca2">不是 IF + ELSE；完整标识符更长</text><rect x="60" y="302" width="1080" height="108" rx="16" fill="#e6f4ec" stroke="#92c6a6" stroke-width="2"/><text x="92" y="347" font-size="25" font-weight="bold" fill="#2b744c">输入：&gt;=</text><text x="474" y="347" font-size="24" fill="#2b744c">GE(&gt;=)</text><text x="474" y="382" font-size="18" fill="#528869">双字符运算符优先于较短单字符词素</text><rect x="60" y="432" width="1080" height="108" rx="16" fill="#fff0de" stroke="#e0bd91" stroke-width="2"/><text x="92" y="477" font-size="25" font-weight="bold" fill="#895b2b">输入：10..20</text><text x="474" y="477" font-size="23" fill="#895b2b">INTEGER(10) · RANGE(..) · INTEGER(20)</text><text x="474" y="512" font-size="18" fill="#a0794c">前提：小数点后必须至少有一位数字</text></g><text x="65" y="605" font-size="20" font-family="sans-serif" fill="#5e768d">语言规则变动时必须重新定义预期输出；不要用单个硬编码样例代替规范。</text></svg>