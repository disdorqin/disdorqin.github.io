<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">编译器前端三个结构转换</title><desc id="d">从源字符到 Token，再到语法树和语义检查；各阶段有不同的输入输出以及错误责任。</desc><rect width="1200" height="640" rx="22" fill="#f5f8fc"/><text x="62" y="80" font-family="sans-serif" font-size="37" font-weight="bold" fill="#1e3958">编译器前端：把字符逐步变成程序结构</text><text x="62" y="121" font-family="sans-serif" font-size="20" fill="#61778d">不是一步把文字变成机器码；每一层都缩小需要解决的问题范围</text><g font-family="sans-serif" text-anchor="middle"><rect x="58" y="202" width="237" height="194" rx="18" fill="#e4eeff" stroke="#83a8da" stroke-width="2"/><text x="176" y="255" font-size="26" font-weight="bold" fill="#28598d">源代码</text><text x="176" y="307" font-size="20" fill="#4c6e94">count := 10;</text><text x="176" y="352" font-size="18" fill="#5d7899">连续字符</text><rect x="355" y="202" width="237" height="194" rx="18" fill="#dff4e9" stroke="#81bc9b" stroke-width="2"/><text x="473" y="255" font-size="26" font-weight="bold" fill="#276d49">词法分析</text><text x="473" y="303" font-size="20" fill="#518265">IDENT · ASSIGN</text><text x="473" y="337" font-size="20" fill="#518265">INTEGER · SEMI</text><rect x="652" y="202" width="237" height="194" rx="18" fill="#fff0dc" stroke="#d8b588" stroke-width="2"/><text x="770" y="255" font-size="26" font-weight="bold" fill="#855527">语法分析</text><text x="770" y="309" font-size="20" fill="#96724d">赋值语句结构</text><text x="770" y="345" font-size="18" fill="#96724d">表达式 / 子树</text><rect x="949" y="202" width="197" height="194" rx="18" fill="#eee7fa" stroke="#afa0d5" stroke-width="2"/><text x="1048" y="255" font-size="25" font-weight="bold" fill="#69569a">语义检查</text><text x="1048" y="306" font-size="18" fill="#8270a8">变量是否存在？</text><text x="1048" y="344" font-size="18" fill="#8270a8">类型是否匹配？</text></g><g stroke="#6883a2" fill="none" stroke-width="4"><path d="M295 297 H345"/><path d="M592 297 H642"/><path d="M889 297 H939"/></g><g fill="#6883a2"><path d="M337 289 l12 8 -12 8z"/><path d="M634 289 l12 8 -12 8z"/><path d="M931 289 l12 8 -12 8z"/></g><rect x="58" y="465" width="1088" height="106" rx="18" fill="#e9eff6"/><text x="83" y="508" font-size="24" font-family="sans-serif" font-weight="bold" fill="#304e6c">每一步都能够独立测试</text><text x="83" y="544" font-size="19" font-family="sans-serif" fill="#5c718a">非法词素 → 词法错误；括号不配对 → 语法错误；未声明变量 → 语义错误。</text></svg>