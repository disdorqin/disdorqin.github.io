<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 550"><rect width="1060" height="550" fill="#f8fafc"/><text x="48" y="62" font-family="sans-serif" font-size="31" font-weight="bold" fill="#1c3b58">滚动回测：每次从当时的预测起点出发</text><text x="48" y="94" font-family="sans-serif" font-size="18" fill="#65778a">训练窗口随时间推进；未来评价区间不能参与当前模型选择</text><g font-family="sans-serif" font-size="18"><text x="50" y="171" fill="#455f7a">第 1 轮</text><text x="50" y="255" fill="#455f7a">第 2 轮</text><text x="50" y="339" fill="#455f7a">第 3 轮</text></g><rect x="180" y="135" width="420" height="55" rx="9" fill="#8db6e4"/><rect x="610" y="135" width="110" height="55" rx="9" fill="#f0b86e"/><rect x="180" y="219" width="530" height="55" rx="9" fill="#8db6e4"/><rect x="720" y="219" width="110" height="55" rx="9" fill="#f0b86e"/><rect x="180" y="303" width="640" height="55" rx="9" fill="#8db6e4"/><rect x="830" y="303" width="110" height="55" rx="9" fill="#f0b86e"/><g font-family="sans-serif" font-size="19" fill="#153d6b"><text x="358" y="170">只用历史训练</text><text x="429" y="254">历史扩展</text><text x="477" y="338">历史继续扩展</text></g><g font-family="sans-serif" font-size="16" fill="#855119"><text x="631" y="170">预测</text><text x="741" y="254">预测</text><text x="851" y="338">预测</text></g><rect x="180" y="420" width="35" height="24" fill="#8db6e4"/><text x="230" y="440" font-family="sans-serif" font-size="18" fill="#4c627b">当时可用的训练时间</text><rect x="535" y="420" width="35" height="24" fill="#f0b86e"/><text x="585" y="440" font-family="sans-serif" font-size="18" fill="#4c627b">冻结模型后的评价时间</text><text x="180" y="495" font-family="sans-serif" font-size="18" fill="#637589">示意为扩展窗口；固定长度窗口同样需要遵守时间边界。</text></svg>