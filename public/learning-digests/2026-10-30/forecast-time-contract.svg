<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 540"><rect width="1060" height="540" fill="#f7f9fc"/><text x="45" y="61" font-family="sans-serif" font-size="31" font-weight="bold" fill="#183851">同一个目标时刻存在三条时间线</text><text x="45" y="94" font-family="sans-serif" font-size="19" fill="#586e89">示例：周二 12:00 的真实天气与预报不能混为同一信息</text><g font-family="sans-serif" font-size="21"><text x="52" y="166" fill="#345f94">数据事件时间</text><text x="52" y="277" fill="#345f94">版本发布时间</text><text x="52" y="386" fill="#345f94">预测截止时间</text></g><g stroke="#9caec1" stroke-width="4" fill="none"><path d="M300 155 H1000"/><path d="M300 265 H1000"/><path d="M300 375 H1000"/></g><g font-family="sans-serif"><circle cx="895" cy="155" r="12" fill="#da8f50"/><text x="786" y="131" fill="#945721" font-size="16">周二 12:00 真实值</text><circle cx="425" cy="265" r="12" fill="#4c9b79"/><text x="347" y="239" fill="#2b7656" font-size="17">周一 06:00 预报已发布</text><circle cx="580" cy="375" r="12" fill="#5286c3"/><text x="487" y="349" fill="#2a5b99" font-size="17">周一 10:00 预测</text><path d="M425 278 V364 H568" stroke="#4c9b79" stroke-width="3" fill="none"/><text x="45" y="468" font-size="21" fill="#30536b">只有预测起点之前发布的合法版本可用，未来真实值不应进入输入。</text></g></svg>