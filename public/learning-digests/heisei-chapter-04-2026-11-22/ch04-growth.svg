<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-label="日本两段经济扩张比较：2002年至2008年持续约73个月平均年实际增速约2.4%，伊奘诺景气阶段平均约11.5%，长期不等于高速">
<rect width="1200" height="580" rx="26" fill="#132438"/><text x="55" y="72" fill="#f6f8fc" font-family="sans-serif" font-weight="bold" font-size="31">扩张持续多久 ≠ 增长速度有多快</text>
<text x="57" y="114" fill="#bed1e3" font-family="sans-serif" font-size="17">日本内阁府历史分期：这里比较的是不同扩张期的平均实际增长率</text>
<g font-family="sans-serif"><rect x="60" y="176" width="510" height="252" rx="23" fill="#284864" stroke="#6fa8d2" stroke-width="2"/><text x="86" y="218" fill="#a5d6fa" font-size="22" font-weight="bold">2002—2008 年的扩张</text><text x="86" y="305" fill="#f7fafd" font-size="68" font-weight="bold">2.4%</text><text x="86" y="348" fill="#c3dff2" font-size="18">扩张约 73 个月</text><text x="86" y="382" fill="#c3dff2" font-size="16">持续很长，不等于每年高速增长</text>
<rect x="629" y="176" width="511" height="252" rx="23" fill="#5b462f" stroke="#dcb16a" stroke-width="2"/><text x="655" y="218" fill="#f9d9a9" font-size="22" font-weight="bold">战后伊奘诺景气时期</text><text x="655" y="305" fill="#fff7e5" font-size="68" font-weight="bold">11.5%</text><text x="655" y="348" fill="#ffe4bc" font-size="18">年均实际增速（历史分期）</text><text x="655" y="382" fill="#ffe4bc" font-size="16">两者发展阶段与经济结构不同</text></g>
<rect x="59" y="462" width="1082" height="65" rx="15" fill="#213b53"/><text x="82" y="491" fill="#eff8ff" font-family="sans-serif" font-size="18" font-weight="bold">不要把“扩张期较长”翻译成“居民收入和企业竞争力全面修复”。</text><text x="82" y="513" fill="#b9cee0" font-family="sans-serif" font-size="14">数据口径：日本内阁府经济财政报告 2006；2002—2008 年扩张划分依日本银行 2012 回顾。</text></svg>