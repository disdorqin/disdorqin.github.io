<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-label="区分短期经济复苏和长期结构能力的不同指标与证据链">
<rect width="1200" height="590" rx="26" fill="#15263a"/><text x="53" y="70" fill="#f5f8fc" font-family="sans-serif" font-size="30" font-weight="bold">赚到了钱，不一定等于建立了新能力</text><text x="55" y="108" fill="#bacee2" font-family="sans-serif" font-size="17">将周期变量与结构变量分开观察，再决定是否扩大长期不可逆投资</text>
<rect x="55" y="156" width="505" height="315" rx="22" fill="#31476a" stroke="#7eadd8" stroke-width="2"/><rect x="640" y="156" width="506" height="315" rx="22" fill="#315348" stroke="#7cc2a4" stroke-width="2"/>
<g font-family="sans-serif"><text x="81" y="202" fill="#b9dcff" font-size="23" font-weight="bold">短期周期改善</text><text x="666" y="202" fill="#bff3da" font-size="23" font-weight="bold">长期结构能力</text>
<text x="81" y="266" fill="#f6f8ff" font-size="20">出口订单、商品价格、汇率</text><text x="81" y="310" fill="#f6f8ff" font-size="20">短期利润、股价、融资条件</text><text x="81" y="354" fill="#f6f8ff" font-size="20">宏观刺激与经济周期阶段</text><text x="81" y="414" fill="#c4d9ef" font-size="16">指标改善可以真实，但未必持久</text>
<text x="666" y="266" fill="#f6f8ff" font-size="20">生产率、技术与组织流程</text><text x="666" y="310" fill="#f6f8ff" font-size="20">研发积累、产品竞争与客户价值</text><text x="666" y="354" fill="#f6f8ff" font-size="20">抗冲击性与可迁移技能</text><text x="666" y="414" fill="#c7f0df" font-size="16">需要跨周期的真实结果检验</text></g>
<rect x="55" y="501" width="1090" height="56" rx="13" fill="#25394f"/><text x="77" y="536" fill="#e5f3ff" font-family="sans-serif" font-size="18">结构性主张要求反事实研究；不能把一时的出口利润或股价上涨直接画成因果证明。</text>
</svg>