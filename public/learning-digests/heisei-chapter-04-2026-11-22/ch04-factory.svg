<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 585" role="img" aria-label="比较本土一体化制造与全球专业化网络的优势、成本和风险，强调两者都是有条件的商业选择">
<rect width="1200" height="585" rx="26" fill="#f7f9fc"/><text x="55" y="69" fill="#20354b" font-family="sans-serif" font-size="29" font-weight="bold">龟山工厂与全球分工：没有一条永远最优的路线</text><text x="55" y="108" fill="#667991" font-family="sans-serif" font-size="17">日本液晶产业的决策，不是简单的“拥有工厂 = 落后”</text>
<rect x="55" y="153" width="518" height="337" rx="22" fill="#e8f1fa" stroke="#8bb8e4" stroke-width="2"/><rect x="623" y="153" width="519" height="337" rx="22" fill="#e9f5ec" stroke="#8ac7a2" stroke-width="2"/>
<g font-family="sans-serif"><text x="83" y="196" fill="#2c6895" font-size="24" font-weight="bold">本土一体化制造</text><text x="651" y="196" fill="#26744b" font-size="24" font-weight="bold">全球专业化协作</text>
<text x="83" y="250" fill="#2b4861" font-size="19">优势：工艺协同、质量控制</text><text x="83" y="290" fill="#2b4861" font-size="19">优势：研发与制造反馈紧密</text><text x="83" y="347" fill="#805731" font-size="19">风险：固定资本投入较大</text><text x="83" y="387" fill="#805731" font-size="19">风险：技术换代后产能锁定</text>
<text x="651" y="250" fill="#305b43" font-size="19">优势：供应商规模与成本</text><text x="651" y="290" fill="#305b43" font-size="19">优势：模块化与调整弹性</text><text x="651" y="347" fill="#805731" font-size="19">风险：跨组织协调成本</text><text x="651" y="387" fill="#805731" font-size="19">风险：供应链依赖与信息外泄</text></g>
<rect x="55" y="517" width="1087" height="45" rx="11" fill="#e4eaf2"/><text x="75" y="545" fill="#3a5267" font-family="sans-serif" font-size="17">评价问题：企业当时的需求预测、良率、融资、知识耦合与竞争者扩产，支持哪条方案？</text>
</svg>