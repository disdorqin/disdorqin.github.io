<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="t d"><title id="t">研究主张与证据的对应</title><desc id="d">研究的每项主张需要独立的证据记录，从失败观察到方法必要性和独立测试结果，缺证据不应写入确定结论。</desc><rect width="1200" height="660" rx="24" fill="#f6f8fc"/><text x="60" y="80" font-family="sans-serif" font-size="37" font-weight="bold" fill="#1e3955">主张与证据：双向检查，避免论文叙事断裂</text><text x="61" y="116" font-family="sans-serif" font-size="20" fill="#617993">左侧是我们想证明的事，右侧是必须真正拥有的资料</text><g font-family="sans-serif"><rect x="64" y="171" width="427" height="117" rx="18" fill="#e5efff" stroke="#8daed8" stroke-width="2"/><text x="95" y="219" font-size="25" font-weight="bold" fill="#2a6197">主张 A：任务中存在失败</text><text x="95" y="257" font-size="19" fill="#587a9e">失败场景应可重复、可定义</text><rect x="64" y="326" width="427" height="117" rx="18" fill="#e5efff" stroke="#8daed8" stroke-width="2"/><text x="95" y="374" font-size="25" font-weight="bold" fill="#2a6197">主张 B：新方法确有必要</text><text x="95" y="412" font-size="19" fill="#587a9e">至少对比合理简单替代</text><rect x="64" y="481" width="427" height="117" rx="18" fill="#e5efff" stroke="#8daed8" stroke-width="2"/><text x="95" y="529" font-size="25" font-weight="bold" fill="#2a6197">主张 C：改善可独立重现</text><text x="95" y="567" font-size="19" fill="#587a9e">范围、误差、成本都明确</text><rect x="713" y="171" width="427" height="117" rx="18" fill="#e1f4e8" stroke="#91c7a1" stroke-width="2"/><text x="744" y="219" font-size="25" font-weight="bold" fill="#2c754b">数据审计与诊断结果</text><text x="744" y="257" font-size="19" fill="#568869">任务规则、样本量与失败条件</text><rect x="713" y="326" width="427" height="117" rx="18" fill="#fff0df" stroke="#d6b68b" stroke-width="2"/><text x="744" y="374" font-size="25" font-weight="bold" fill="#885b2c">最接近基线与机制消融</text><text x="744" y="412" font-size="19" fill="#a27b53">严格控制变动因素</text><rect x="713" y="481" width="427" height="117" rx="18" fill="#eee7fa" stroke="#b7a7d7" stroke-width="2"/><text x="744" y="529" font-size="25" font-weight="bold" fill="#695497">冻结协议的真实输出</text><text x="744" y="567" font-size="19" fill="#8270a9">预测文件、日志与不确定性</text></g><g fill="none" stroke="#7b95a9" stroke-width="3"><path d="M491 228 H703"/><path d="M491 384 H703"/><path d="M491 539 H703"/></g></svg>