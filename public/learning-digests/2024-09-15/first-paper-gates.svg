<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 655" role="img" aria-labelledby="t d"><title id="t">本科科研论文四类验收</title><desc id="d">问题价值、实验正确、论断和证据一致、学术伦理四项检查相互独立。</desc><rect width="1200" height="655" rx="24" fill="#f7fafc"/><text x="64" y="76" font-size="37" fill="#1c3753" font-weight="bold" font-family="sans-serif">第一篇论文交稿前的四道验收门槛</text><text x="65" y="112" font-size="20" fill="#678098" font-family="sans-serif">只要有一项缺口，优先补证据，不要靠加长描述弥补</text><g font-family="sans-serif"><rect x="67" y="170" width="506" height="155" rx="20" fill="#e2edff" stroke="#93b1d8" stroke-width="2"/><text x="102" y="221" font-size="28" fill="#2d6098" font-weight="bold">01 · 问题有研究意义吗？</text><text x="102" y="266" font-size="20" fill="#5077a1">最近邻文献、未解问题、独特性</text><rect x="627" y="170" width="506" height="155" rx="20" fill="#e4f5eb" stroke="#91c3a5" stroke-width="2"/><text x="662" y="221" font-size="28" fill="#2c704b" font-weight="bold">02 · 实验真的正确吗？</text><text x="662" y="266" font-size="20" fill="#57876a">数据许可、复现、对照与随机性</text><rect x="67" y="371" width="506" height="155" rx="20" fill="#fff1dc" stroke="#ddb88a" stroke-width="2"/><text x="102" y="422" font-size="28" fill="#8b5d2e" font-weight="bold">03 · 主张得到支持吗？</text><text x="102" y="467" font-size="20" fill="#a07a50">独立证据、反例、适用范围</text><rect x="627" y="371" width="506" height="155" rx="20" fill="#eee8fa" stroke="#b9a6d9" stroke-width="2"/><text x="662" y="422" font-size="28" fill="#695398" font-weight="bold">04 · 署名与发表合规吗？</text><text x="662" y="467" font-size="20" fill="#8473ad">贡献责任、授权、引用和投稿政策</text></g><rect x="67" y="562" width="1066" height="59" rx="13" fill="#233e58"/><text x="97" y="600" font-family="sans-serif" font-size="21" fill="#fff" font-weight="bold">好论文不是证书的快捷方式，而是一条可以被其他研究者复查的知识证据链。</text></svg>