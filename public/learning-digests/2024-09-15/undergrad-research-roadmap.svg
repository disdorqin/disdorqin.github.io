<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 645" role="img" aria-labelledby="t d"><title id="t">本科生科研六个阶段</title><desc id="d">从方向探索、导师沟通、文献矩阵、合法基线、实验验证到论文审核的六步路线。</desc><rect width="1200" height="645" rx="24" fill="#f6f9fc"/><text x="58" y="79" font-family="sans-serif" font-size="37" font-weight="bold" fill="#193958">第一篇论文：先构建能够验证的研究能力</text><text x="58" y="121" font-family="sans-serif" font-size="20" fill="#697f94">阶段之间可以回退；第一次尝试失败不等于没有学习收获</text><g font-family="sans-serif" text-anchor="middle"><rect x="65" y="183" width="326" height="145" rx="20" fill="#e2edff" stroke="#8faeda" stroke-width="2"/><text x="228" y="232" fill="#2a6097" font-size="25" font-weight="bold">01 · 选择方向</text><text x="228" y="272" fill="#587b9f" font-size="19">兴趣、基础、资源、评估</text><rect x="437" y="183" width="326" height="145" rx="20" fill="#e2edff" stroke="#8faeda" stroke-width="2"/><text x="600" y="232" fill="#2a6097" font-size="25" font-weight="bold">02 · 寻找导师</text><text x="600" y="272" fill="#587b9f" font-size="19">读近期工作、带具体问题</text><rect x="809" y="183" width="326" height="145" rx="20" fill="#e2edff" stroke="#8faeda" stroke-width="2"/><text x="972" y="232" fill="#2a6097" font-size="25" font-weight="bold">03 · 文献地图</text><text x="972" y="272" fill="#587b9f" font-size="19">近邻论文、差异与边界</text><rect x="65" y="386" width="326" height="145" rx="20" fill="#e3f3e8" stroke="#8fbc9c" stroke-width="2"/><text x="228" y="435" fill="#29704a" font-size="25" font-weight="bold">04 · 合法基线</text><text x="228" y="476" fill="#588469" font-size="19">数据合同、指标与复现</text><rect x="437" y="386" width="326" height="145" rx="20" fill="#fff0dc" stroke="#d8b484" stroke-width="2"/><text x="600" y="435" fill="#865c2d" font-size="25" font-weight="bold">05 · 检验假设</text><text x="600" y="476" fill="#9e7955" font-size="19">对照、消融、反例</text><rect x="809" y="386" width="326" height="145" rx="20" fill="#eee8fa" stroke="#b0a2d2" stroke-width="2"/><text x="972" y="435" fill="#6a5899" font-size="25" font-weight="bold">06 · 论文审核</text><text x="972" y="476" fill="#8474ae" font-size="19">证据、署名、合规</text></g><g fill="none" stroke="#8193a8" stroke-width="3"><path d="M391 255 H427"/><path d="M763 255 H799"/><path d="M972 328 V350 H228 V376"/><path d="M391 458 H427"/><path d="M763 458 H799"/></g><text x="66" y="592" font-family="sans-serif" font-size="20" fill="#546e87">科研成果来自证据逐级升级，而不是因为完成了一个漂亮的 PDF。</text></svg>