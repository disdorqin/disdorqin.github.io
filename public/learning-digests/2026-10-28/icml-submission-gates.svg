<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 655" role="img" aria-labelledby="title desc"><title id="title">ICML 稿件提交前四层检查</title><desc id="desc">从科学问题、实验复现到版式和伦理四种独立的提交检查门槛。</desc><rect width="1200" height="655" fill="#f7f9fc"/><text x="66" y="77" font-family="sans-serif" font-size="37" font-weight="bold" fill="#20374f">提交前：四道互不替代的门槛</text><text x="66" y="111" font-family="sans-serif" font-size="20" fill="#667d93">格式正确不能补足科学缺陷；精美图表不能补足实际实验</text><g font-family="sans-serif"><rect x="76" y="172" width="500" height="150" rx="22" fill="#e9f1ff" stroke="#93b1db" stroke-width="2"/><text x="109" y="219" font-size="28" font-weight="bold" fill="#235a98">01 研究主张</text><text x="109" y="263" font-size="21" fill="#5078a6">研究问题、近邻文献、贡献边界</text><text x="109" y="291" font-size="17" fill="#6e8cb2">是否存在无法反驳的空泛结论？</text><rect x="626" y="172" width="500" height="150" rx="22" fill="#e5f4ea" stroke="#91c5a1" stroke-width="2"/><text x="659" y="219" font-size="28" font-weight="bold" fill="#276a45">02 结果证据</text><text x="659" y="263" font-size="21" fill="#53836a">冻结数据、真实训练、可比基线</text><text x="659" y="291" font-size="17" fill="#709784">数字能否从运行记录重新计算？</text><rect x="76" y="370" width="500" height="150" rx="22" fill="#fff1de" stroke="#dec198" stroke-width="2"/><text x="109" y="417" font-size="28" font-weight="bold" fill="#86562b">03 投稿格式</text><text x="109" y="461" font-size="21" fill="#9d7953">官方 LaTeX、正文页数、参考文献</text><text x="109" y="489" font-size="17" fill="#aa8b65">PDF 可读且与当届规范一致？</text><rect x="626" y="370" width="500" height="150" rx="22" fill="#eee9fa" stroke="#b6a7d5" stroke-width="2"/><text x="659" y="417" font-size="28" font-weight="bold" fill="#68509b">04 学术伦理</text><text x="659" y="461" font-size="21" fill="#8470ac">双盲、原创引用、AI 使用责任</text><text x="659" y="489" font-size="17" fill="#9988b8">是否有不当披露、抄袭或注入？</text></g><rect x="76" y="560" width="1050" height="55" rx="13" fill="#223b55"/><text x="102" y="596" font-size="22" font-family="sans-serif" font-weight="bold" fill="#ffffff">任何一项未过关 → 明确退回对应步骤，不用美化措辞掩盖。</text></svg>