<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">论文主张与证据映射</title><desc id="desc">每条引言主张连接具体的文献证据、模型定义、实测结果和限制条件。</desc><rect width="1200" height="650" fill="#f7f9fc"/><text x="66" y="78" font-size="37" fill="#1f3957" font-family="sans-serif" font-weight="bold">Claim → Evidence：让每一句创新陈述有根可查</text><text x="67" y="116" font-family="sans-serif" font-size="20" fill="#6c7f94">下列节点是教学用的检验结构，不代表任何具体模型的真实成果</text><g font-family="sans-serif"><rect x="72" y="180" width="354" height="115" rx="18" fill="#e5effe" stroke="#83a7d3" stroke-width="2"/><text x="99" y="220" font-size="25" fill="#285990" font-weight="bold">主张 A：确实存在失败</text><text x="99" y="258" font-size="18" fill="#5c7da4">先定义评价情境与正确口径</text><rect x="72" y="336" width="354" height="115" rx="18" fill="#e5effe" stroke="#83a7d3" stroke-width="2"/><text x="99" y="376" font-size="25" fill="#285990" font-weight="bold">主张 B：方法有明确机制</text><text x="99" y="414" font-size="18" fill="#5c7da4">说明变量、假设与必要模块</text><rect x="72" y="492" width="354" height="115" rx="18" fill="#e5effe" stroke="#83a7d3" stroke-width="2"/><text x="99" y="532" font-size="25" fill="#285990" font-weight="bold">主张 C：改善真实且稳定</text><text x="99" y="570" font-size="18" fill="#5c7da4">比较独立时间段与失败反例</text><rect x="735" y="178" width="386" height="118" rx="18" fill="#e6f5ec" stroke="#8cc5a5" stroke-width="2"/><text x="763" y="222" font-size="25" fill="#286746" font-weight="bold">原始观测 / 文献定位</text><text x="763" y="260" font-size="18" fill="#5c8b6a">附来源、版本、评价样本</text><rect x="735" y="334" width="386" height="118" rx="18" fill="#fff0dd" stroke="#d7b68a" stroke-width="2"/><text x="763" y="378" font-size="25" fill="#805525" font-weight="bold">方法定义 / 消融</text><text x="763" y="416" font-size="18" fill="#977748">张量、目标与退化条件</text><rect x="735" y="490" width="386" height="118" rx="18" fill="#eee7fa" stroke="#b8a5d7" stroke-width="2"/><text x="763" y="534" font-size="25" fill="#635098" font-weight="bold">预测文件 / 统计复算</text><text x="763" y="572" font-size="18" fill="#806cb0">种子、日期、指标与误差范围</text></g><g stroke="#8195aa" stroke-width="4" fill="none"><path d="M426 236 H725"/><path d="M426 395 H725"/><path d="M426 550 H725"/></g><g fill="#8195aa"><path d="M723 227 l13 9 -13 9z"/><path d="M723 386 l13 9 -13 9z"/><path d="M723 541 l13 9 -13 9z"/></g></svg>