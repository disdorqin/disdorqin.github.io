<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">AI 辅助论文写作的五层工作流</title><desc id="desc">从问题与原始证据出发，依次形成研究主张、冻结实验、写作草稿和独立出版审查。</desc><rect width="1200" height="670" fill="#f5f8fd"/><rect x="26" y="26" width="1148" height="618" rx="27" fill="#ffffff" stroke="#e0e9f2" stroke-width="2"/><text x="65" y="86" font-family="sans-serif" font-size="38" font-weight="bold" fill="#19344c">AI 论文写作：文字必须追溯到研究证据</text><text x="66" y="122" font-family="sans-serif" font-size="21" fill="#70859c">写作助手是辅助者；科学责任与终稿判断始终由研究者承担</text><g font-family="sans-serif" text-anchor="middle"><rect x="75" y="173" width="204" height="152" rx="20" fill="#e7f2ff" stroke="#80aee2" stroke-width="2"/><text x="177" y="228" fill="#1e5892" font-size="24" font-weight="bold">研究问题</text><text x="177" y="271" fill="#52779e" font-size="18">观察失败与反例</text><rect x="305" y="173" width="204" height="152" rx="20" fill="#e7f2ff" stroke="#80aee2" stroke-width="2"/><text x="407" y="228" fill="#1e5892" font-size="24" font-weight="bold">原始证据</text><text x="407" y="271" fill="#52779e" font-size="18">论文、源码、数据</text><rect x="535" y="173" width="204" height="152" rx="20" fill="#e8f5ec" stroke="#8ac6a1" stroke-width="2"/><text x="637" y="228" fill="#246c43" font-size="24" font-weight="bold">真实实验</text><text x="637" y="271" fill="#56896a" font-size="18">运行、复算、失败</text><rect x="765" y="173" width="204" height="152" rx="20" fill="#fff0dd" stroke="#dcb88a" stroke-width="2"/><text x="867" y="228" fill="#86572c" font-size="24" font-weight="bold">AI 协助起草</text><text x="867" y="271" fill="#a07953" font-size="18">叙事、排版、检查</text><rect x="995" y="173" width="138" height="152" rx="20" fill="#f0e9ff" stroke="#b5a1da" stroke-width="2"/><text x="1064" y="226" fill="#6852a1" font-size="23" font-weight="bold">复核</text><text x="1064" y="265" fill="#806bad" font-size="16">作者签字</text></g><g stroke="#6c8aa5" stroke-width="3" fill="none"><path d="M279 250 H297"/><path d="M509 250 H527"/><path d="M739 250 H757"/><path d="M969 250 H987"/></g><g fill="#6c8aa5"><path d="M295 243 L306 250 295 257Z"/><path d="M525 243 L536 250 525 257Z"/><path d="M755 243 L766 250 755 257Z"/><path d="M985 243 L996 250 985 257Z"/></g><rect x="75" y="375" width="1058" height="94" rx="19" fill="#e9eff6"/><text x="111" y="413" font-family="sans-serif" font-size="24" font-weight="bold" fill="#26455e">每条主张都应有证据地址</text><text x="111" y="447" font-family="sans-serif" font-size="20" fill="#587187">AI 可以指出缺口；找不到证据时，应暂停写作而不是填补想象数字。</text><rect x="75" y="503" width="1058" height="94" rx="19" fill="#203c5e"/><text x="111" y="542" font-family="sans-serif" font-size="23" font-weight="bold" fill="#ffffff">独立验收：科学性 · 可复现性 · 会议格式 · 匿名与伦理</text><text x="111" y="574" font-family="sans-serif" font-size="19" fill="#b8d3e7">通过 LaTeX 构建 ≠ 方法真实有效；测试数目多 ≠ 研究结论更可靠。</text></svg>