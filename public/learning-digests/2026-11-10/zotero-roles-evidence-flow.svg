<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">研究证据的三层职责</title><desc id="desc">从文献题录附件批注到人工解释再到研究问题实验，反向箭头要求每个结论能回到原文。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#33576b"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#183347;font-size:22px}.h{font-size:32px;font-weight:700}.sub{font-size:20px;fill:#465f70}.label{font-weight:700;font-size:25px}.small{font-size:19px}.line{fill:none;stroke:#33576b;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#aec4ce;stroke-width:2}</style><rect width="1200" height="800" fill="#f2f6f8"/><text x="48" y="58" class="h">证据不是文件搬运：三层职责与反向回查</text><text x="48" y="96" class="sub">实线表示可追溯关系；人工解释是必要步骤，不由导入器自动完成。</text><rect x="48" y="145" width="324" height="345" rx="16" fill="#e3f0f6" stroke="#aec4ce" stroke-width="2"/><text x="70" y="188" class="label">Zotero｜原始证据</text><text x="70" y="222" class="sub">作品与材料的身份</text><rect x="438" y="145" width="324" height="345" rx="16" fill="#e8f2e9" stroke="#aec4ce" stroke-width="2"/><text x="460" y="188" class="label">阅读卡｜人工解释</text><text x="460" y="222" class="sub">原文与判断分开</text><rect x="828" y="145" width="324" height="345" rx="16" fill="#fff0d9" stroke="#aec4ce" stroke-width="2"/><text x="850" y="188" class="label">问题与实验｜论证</text><text x="850" y="222" class="sub">条件与可证伪结论</text><text x="70" y="290" class="small">题录：作者、年份、标识符</text><text x="70" y="355" class="small">附件：来源、版本、可用性</text><text x="70" y="420" class="small">批注：位置、摘录、评论</text><text x="460" y="290" class="small">作者说了什么？</text><text x="460" y="355" class="small">我为什么这样理解？</text><text x="460" y="420" class="small">限制与下一步核查是什么？</text><text x="850" y="290" class="small">问题：事件评价改变排名？</text><text x="850" y="355" class="small">实验：数据切分与阈值规则</text><text x="850" y="420" class="small">判断：结果、限制、反例</text><path d="M372 330H432" class="line"/><path d="M762 330H822" class="line"/><text x="385" y="310" class="small">核对</text><text x="775" y="310" class="small">检验</text><path d="M990 490V550H210V496" class="line"/><text x="348" y="580" class="sub">反向验收：结论 → 运行记录／证据卡 → 正确附件与原文位置</text><rect x="48" y="620" width="1104" height="130" rx="16" fill="#fff" stroke="#aec4ce" stroke-width="2"/><text x="70" y="658" class="label">示例：整体误差低，不等于尖峰事件表现好。</text><text x="70" y="698" class="sub">必须核对事件定义、预测步长和测试窗口，再决定文献是否支持当前判断。</text><text x="70" y="730" class="small">目录保存材料；索引组织问题；来源定位让两者能够互相检查。</text></svg>
