<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-label="金融危机关键时间点：2007年8月基金冻结、2008年3月贝尔斯登、9月房利美房地美托管、雷曼破产、AIG救助、10月TARP法案">
<rect width="1200" height="610" rx="26" fill="#f9fafc"/><text x="54" y="68" fill="#21354c" font-family="sans-serif" font-size="30" font-weight="bold">危机不是 2008 年 9 月 15 日突然开始的</text><text x="56" y="106" fill="#697d90" font-family="sans-serif" font-size="16">2007–2008 年金融危机官方时间线｜事件日期，不是对金融影响的因果排名</text>
<line x1="92" y1="301" x2="1107" y2="301" stroke="#8ca3b9" stroke-width="6" stroke-linecap="round"/>
<g font-family="sans-serif" text-anchor="middle">
<circle cx="135" cy="301" r="13" fill="#4b86b4"/><text x="135" y="274" font-size="18" fill="#2b587a" font-weight="bold">2007.08</text><rect x="50" y="338" width="178" height="103" rx="13" fill="#e0edf7"/><text x="139" y="377" font-size="15" fill="#2d516e">巴黎银行基金</text><text x="139" y="404" font-size="15" fill="#2d516e">暂停赎回</text>
<circle cx="355" cy="301" r="13" fill="#a87e37"/><text x="355" y="274" font-size="18" fill="#8b662d" font-weight="bold">2008.03</text><rect x="270" y="147" width="176" height="107" rx="13" fill="#f9eed9"/><text x="357" y="186" font-size="15" fill="#795628">贝尔斯登困境</text><text x="357" y="212" font-size="15" fill="#795628">被协助收购</text>
<circle cx="572" cy="301" r="13" fill="#985caf"/><text x="572" y="274" font-size="18" fill="#81479a" font-weight="bold">2008.09.07</text><rect x="483" y="338" width="181" height="103" rx="13" fill="#f1e9f8"/><text x="573" y="378" font-size="15" fill="#754c86">两房进入</text><text x="573" y="405" font-size="15" fill="#754c86">政府托管</text>
<circle cx="787" cy="301" r="13" fill="#d66c73"/><text x="787" y="274" font-size="18" fill="#9b4855" font-weight="bold">09.15–16</text><rect x="703" y="147" width="176" height="107" rx="13" fill="#f9e5e8"/><text x="791" y="186" font-size="15" fill="#91444d">雷曼申请破产</text><text x="791" y="212" font-size="15" fill="#91444d">AIG 获应急信贷</text>
<circle cx="1005" cy="301" r="13" fill="#398876"/><text x="1005" y="274" font-size="18" fill="#287564" font-weight="bold">2008.10.03</text><rect x="914" y="338" width="182" height="103" rx="13" fill="#e0f3ec"/><text x="1005" y="378" font-size="15" fill="#2e715b">紧急稳定法</text><text x="1005" y="405" font-size="15" fill="#2e715b">建立 TARP</text></g>
<rect x="54" y="484" width="1090" height="79" rx="14" fill="#e8edf3"/><text x="80" y="518" fill="#304f67" font-family="sans-serif" font-size="18" font-weight="bold">从信用质量问题，发展为市场定价、短期融资与系统性信任危机。</text><text x="80" y="545" fill="#697d90" font-family="sans-serif" font-size="14">来源：明尼阿波利斯联储、纽约联储及美国财政部官方危机时间线。</text>
</svg>