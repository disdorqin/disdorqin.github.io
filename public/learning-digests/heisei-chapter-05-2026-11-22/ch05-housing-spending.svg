<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-label="住房价格上涨经可抵押净值、再融资、家庭消费传导到商品进口，但每一步都有条件、不是房价免费创造财富">
<rect width="1200" height="610" rx="25" fill="#14253a"/><text x="53" y="71" fill="#f6f9fe" font-family="sans-serif" font-size="31" font-weight="bold">住房价格，怎样变成消费和出口订单？</text><text x="56" y="112" fill="#b8cde3" font-family="sans-serif" font-size="17">传导机制成立并不等于知道它对每个汽车品牌的精确贡献</text>
<g font-family="sans-serif"><rect x="55" y="178" width="245" height="205" rx="19" fill="#294b6b" stroke="#83b9e8"/><rect x="336" y="178" width="245" height="205" rx="19" fill="#3e4a68" stroke="#b6a8e2"/><rect x="617" y="178" width="245" height="205" rx="19" fill="#5c4b36" stroke="#d5b084"/><rect x="898" y="178" width="245" height="205" rx="19" fill="#29594e" stroke="#8ed5bd"/>
<text x="77" y="231" fill="#c9e6ff" font-size="20" font-weight="bold">01｜房价上涨</text><text x="77" y="278" fill="#f5f9ff" font-size="18">抵押资产价值增加</text><text x="77" y="315" fill="#d0dfef" font-size="16">不等于现金到账</text>
<text x="358" y="231" fill="#e4d9ff" font-size="20" font-weight="bold">02｜再融资</text><text x="358" y="278" fill="#f5f9ff" font-size="18">扩大住房抵押借贷</text><text x="358" y="315" fill="#e0dbec" font-size="16">新增债务须偿还</text>
<text x="639" y="231" fill="#ffe7c6" font-size="20" font-weight="bold">03｜扩大消费</text><text x="639" y="278" fill="#f5f9ff" font-size="18">汽车、耐用品及服务</text><text x="639" y="315" fill="#eadbc7" font-size="16">家庭用途存在差异</text>
<text x="920" y="231" fill="#d0ffe7" font-size="20" font-weight="bold">04｜出口受益</text><text x="920" y="278" fill="#f5f9ff" font-size="18">进口需求可能增加</text><text x="920" y="315" fill="#d4eadf" font-size="16">份额取决于产品竞争</text></g>
<g fill="#a8c5da"><polygon points="307 273 329 283 307 293"/><polygon points="588 273 610 283 588 293"/><polygon points="869 273 891 283 869 293"/></g>
<rect x="55" y="422" width="1087" height="117" rx="17" fill="#203950"/>
<text x="79" y="460" fill="#e7f4ff" font-family="sans-serif" font-size="20" font-weight="bold">已研究的部分：住房财富效应经由借贷传导至支出</text>
<text x="79" y="490" fill="#c3d5e9" font-family="sans-serif" font-size="16">Mian &amp; Sufi (2014) 条件估计：2004 年约为 GDP 的 0.8%，2005–06 年各约 1.3%。</text>
<text x="79" y="520" fill="#c3d5e9" font-family="sans-serif" font-size="15">未证实部分：将这两项 GDP 份额直接换算成“丰田汽车的泡沫依赖度”。</text>
<text x="1140" y="583" fill="#8ea5bc" font-family="sans-serif" font-size="13" text-anchor="end">原创机制示意，非实证路径系数图</text></svg>