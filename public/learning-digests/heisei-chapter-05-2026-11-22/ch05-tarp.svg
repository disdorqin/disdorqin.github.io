<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 605" role="img" aria-label="TARP 2008年授权7000亿美元、实际发放约4440亿美元、2024年估计终身补贴成本约310亿美元，数值不同不能相加">
<rect width="1200" height="605" rx="26" fill="#122438"/><text x="56" y="70" fill="#f5f9ff" font-family="sans-serif" font-size="30" font-weight="bold">7000 亿美元，最后真的损失了多少？</text><text x="56" y="109" fill="#b9cee3" font-family="sans-serif" font-size="17">TARP：授权额度、实际发放与净补贴成本是不同统计口径</text>
<g font-family="sans-serif"><rect x="58" y="162" width="336" height="290" rx="20" fill="#244a6b" stroke="#7cbee7" stroke-width="2"/><text x="82" y="206" fill="#a4dcff" font-size="20" font-weight="bold">最初法定授权</text><text x="82" y="307" fill="#f5faff" font-size="60" font-weight="bold">$700B</text><text x="82" y="361" fill="#d1e4f5" font-size="18">可使用的上限</text><text x="82" y="406" fill="#b7d2e8" font-size="16">≠ 实际全部投入</text>
<rect x="432" y="162" width="336" height="290" rx="20" fill="#335b4c" stroke="#88c9ae" stroke-width="2"/><text x="456" y="206" fill="#bbf4d9" font-size="20" font-weight="bold">实际已发放</text><text x="456" y="307" fill="#f5faff" font-size="60" font-weight="bold">$444B</text><text x="456" y="361" fill="#d5f2e3" font-size="18">部分后来回收</text><text x="456" y="406" fill="#bce5d1" font-size="16">≠ 最终净财政成本</text>
<rect x="806" y="162" width="336" height="290" rx="20" fill="#584831" stroke="#e1b982" stroke-width="2"/><text x="830" y="206" fill="#ffe5b8" font-size="20" font-weight="bold">终身补贴成本估计</text><text x="830" y="307" fill="#f5faff" font-size="60" font-weight="bold">$31B</text><text x="830" y="361" fill="#f7e6cc" font-size="18">美国 CBO 2024 报告</text><text x="830" y="406" fill="#efdbb9" font-size="16">不包含所有危机处置政策</text></g>
<rect x="57" y="486" width="1086" height="76" rx="14" fill="#21394f"/><text x="81" y="516" fill="#eaf5ff" font-family="sans-serif" font-size="18" font-weight="bold">不能相加，也不能把授权额视为政府亏损。</text><text x="81" y="545" fill="#bdd3e5" font-family="sans-serif" font-size="15">来源：美国国会预算办公室 2024-04-19 Final Report on TARP；美国财政部官方项目回顾。</text></svg>