<text x="36" y="83" font-size="15" font-family="Arial,Noto Sans SC,sans-serif" fill="#5d728d">Roles are conceptual; not a mandated single-direction network stack</text><rect x="32" y="141" width="218.4" height="173" rx="16" fill="#e6f2fc" stroke="#78abd0" stroke-width="2"/><circle cx="141.2" cy="171" r="18" fill="#fff" stroke="#78abd0" stroke-width="2"/><text x="141.2" y="177" text-anchor="middle" font-size="16" font-weight="700" fill="#304b70">1</text><text x="141.2" y="220" text-anchor="middle" font-size="19" font-weight="700" fill="#234468" font-family="Arial,Noto Sans SC,sans-serif">Task Plan</text><text x="141.2" y="248" text-anchor="middle" font-size="13" fill="#5b7087" font-family="Arial,Noto Sans SC,sans-serif">Research objective</text><text x="141.2" y="269" text-anchor="middle" font-size="13" fill="#5b7087" font-family="Arial,Noto Sans SC,sans-serif">and stopping rules</text><rect x="266.4" y="141" width="218.4" height="173" rx="16" fill="#e7f7f0" stroke="#70b69b" stroke-width="2"/><circle cx="375.59999999999997" cy="171" r="18" fill="#fff" stroke="#70b69b" stroke-width="2"/><text x="375.59999999999997" y="177" text-anchor="middle" font-size="16" font-weight="700" fill="#304b70">2</text><text x="375.59999999999997" y="220" text-anchor="middle" font-size="19" font-weight="700" fill="#234468" font-family="Arial,Noto Sans SC,sans-serif">Agent</text><text x="375.59999999999997" y="248" text-anchor="middle" font-size="13" fill="#5b7087" font-family="Arial,Noto Sans SC,sans-serif">Choose the next</text><text x="375.59999999999997" y="269" text-anchor="middle" font-size="13" fill="#5b7087" font-family="Arial,Noto Sans SC,sans-serif">bounded action</text><rect x="500.8" y="141" width="218.4" height="173" rx="16" fill="#fff4df" stroke="#e3b46d" stroke-width="2"/><circle cx="610" cy="171" r="18" fill="#fff" stroke="#e3b46d" stroke-width="2"/><text x="610" y="177" text-anchor="middle" font-size="16" font-weight="700" fill="#304b70">3</text><text x="610" y="220" text-anchor="middle" font-size="19" font-weight="700" fill="#234468" font-family="Arial,Noto Sans SC,sans-serif">Skill</text><text x="610" y="248" text-anchor="middle" font-size="13" fill="#5b7087" font-family="Arial,Noto Sans SC,sans-serif">Reusable scripts</text><text x="610" y="269" text-anchor="middle" font-size="13" fill="#5b7087" font-family="Arial,Noto Sans SC,sans-serif">and checklists</text><rect x="735.2" y="141" width="218.4" height="173" rx="16" fill="#f1ecff" stroke="#aaa2d6" stroke-width="2"/><circle cx="844.4000000000001" cy="171" r="18" fill="#fff" stroke="#aaa2d6" stroke-width="2"/><text x="844.4000000000001" y="177" text-anchor="middle" font-size="16" font-weight="700" fill="#304b70">4</text><text x="844.4000000000001" y="220" text-anchor="middle" font-size="19" font-weight="700" fill="#234468" font-family="Arial,Noto Sans SC,sans-serif">MCP</text><text x="844.4000000000001" y="248" text-anchor="middle" font-size="13" fill="#5b7087" font-family="Arial,Noto Sans SC,sans-serif">Connect tools</text><text x="844.4000000000001" y="269" text-anchor="middle" font-size="13" fill="#5b7087" font-family="Arial,Noto Sans SC,sans-serif">and data sources</text><rect x="969.6" y="141" width="218.4" height="173" rx="16" fill="#e3edfb" stroke="#749acc" stroke-width="2"/><circle cx="1078.8" cy="171" r="18" fill="#fff" stroke="#749acc" stroke-width="2"/><text x="1078.8" y="177" text-anchor="middle" font-size="16" font-weight="700" fill="#304b70">5</text><text x="1078.8" y="220" text-anchor="middle" font-size="19" font-weight="700" fill="#234468" font-family="Arial,Noto Sans SC,sans-serif">Knowledge</text><text x="1078.8" y="248" text-anchor="middle" font-size="13" fill="#5b7087" font-family="Arial,Noto Sans SC,sans-serif">Papers, context</text><text x="1078.8" y="269" text-anchor="middle" font-size="13" fill="#5b7087" font-family="Arial,Noto Sans SC,sans-serif">and counterexamples</text><path d="M253.4 228H263.4" stroke="#7186a0" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow)" fill="none"/><path d="M487.8 228H497.8" stroke="#7186a0" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow)" fill="none"/><path d="M722.2 228H732.2" stroke="#7186a0" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow)" fill="none"/><path d="M956.6 228H966.6" stroke="#7186a0" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow)" fill="none"/>
