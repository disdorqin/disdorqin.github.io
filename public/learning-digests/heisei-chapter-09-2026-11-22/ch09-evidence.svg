<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="区分2019年野口观点、2026年官方观察和未来情景推计，并说明应分别使用不同证据评价">
<rect width="1200" height="560" rx="28" fill="#142237"/><text x="56" y="70" font-family="sans-serif" font-size="29" font-weight="bold" fill="#f4f8ff">同一篇经济史，至少有三类不同证据</text><text x="58" y="108" font-family="sans-serif" font-size="17" fill="#b4c8df">作者是研究对象，不是唯一权威；预测不等于事实；建议必须说明条件</text>
<g font-family="sans-serif"><rect x="52" y="165" width="344" height="254" rx="22" fill="#25405f" stroke="#7cafdd" stroke-width="2"/><text x="78" y="208" font-size="23" font-weight="bold" fill="#a6d4fc">01 / 2019 年原著观点</text><text x="78" y="252" font-size="19" fill="#f6f9ff">产业组织未适应世界变化</text><text x="78" y="292" font-size="19" fill="#f6f9ff">主张提高劳动参与率</text><text x="78" y="332" font-size="19" fill="#f6f9ff">强调社会保障压力</text><text x="78" y="378" font-size="15" fill="#b9d5ee">按原文解释，保留作者立场</text>
<rect x="428" y="165" width="344" height="254" rx="22" fill="#245149" stroke="#78cbb5" stroke-width="2"/><text x="454" y="208" font-size="23" font-weight="bold" fill="#a3f0dc">02 / 2026 年已观察值</text><text x="454" y="252" font-size="19" fill="#f6f9ff">65 岁以上人口占比 29.5%</text><text x="454" y="292" font-size="19" fill="#f6f9ff">外国劳动者约 257 万人</text><text x="454" y="332" font-size="19" fill="#f6f9ff">社会保障中央预算约 39.1 兆</text><text x="454" y="378" font-size="15" fill="#beebdd">每个指标要核对基准日与口径</text>
<rect x="804" y="165" width="344" height="254" rx="22" fill="#55452f" stroke="#d7af78" stroke-width="2" stroke-dasharray="7 4"/><text x="830" y="208" font-size="23" font-weight="bold" fill="#ffe3b1">03 / 条件化未来情景</text><text x="830" y="252" font-size="19" fill="#f6f9ff">人口 2070 年情景推计</text><text x="830" y="292" font-size="19" fill="#f6f9ff">养老金与实际工资假设</text><text x="830" y="332" font-size="19" fill="#f6f9ff">未来产业需求不确定</text><text x="830" y="378" font-size="15" fill="#f6d9a8">不是已经发生或保证会发生</text></g>
<path d="M 391 288 L 424 288" stroke="#bcd8ed" stroke-width="3"/><path d="M 767 288 L 800 288" stroke="#bcd8ed" stroke-width="3"/>
<rect x="52" y="450" width="1096" height="64" rx="15" fill="#233751"/><text x="77" y="477" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ecf5ff">青年决策：先问证据是什么，再问在哪些条件下适用。</text><text x="77" y="502" font-family="sans-serif" font-size="15" fill="#c0d5e9">来源：野口 2019 日文原著、总务省、厚生劳动省、财务省、国立人口研究所。</text></svg>