<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-label="不同数据口径的日本老龄劳动力和外籍劳动者数据，注明各自时间和范围，不加总比较">
<rect width="1200" height="580" rx="28" fill="#fafbfe"/><text x="62" y="67" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2f48">劳动供给不是一个“缺口”数字</text><text x="64" y="104" font-family="sans-serif" font-size="17" fill="#667890">三项官方指标，三种观察对象：比例、就业人数、雇主登记人数</text>
<rect x="60" y="151" width="337" height="300" rx="19" fill="#e4effa" stroke="#81b1de"/><text x="86" y="198" font-family="sans-serif" font-size="20" font-weight="bold" fill="#335b82">老龄化人口</text><text x="86" y="278" font-family="sans-serif" font-size="58" font-weight="bold" fill="#204b75">29.5%</text><text x="86" y="318" font-family="sans-serif" font-size="17" fill="#4b6883">65 岁以上人口占比</text><text x="86" y="355" font-family="sans-serif" font-size="15" fill="#57768e">2026 年 11 月人口统计</text><text x="86" y="397" font-family="sans-serif" font-size="15" fill="#57768e">不是劳动参与率</text>
<rect x="431" y="151" width="337" height="300" rx="19" fill="#e7f3e9" stroke="#88bf98"/><text x="455" y="198" font-family="sans-serif" font-size="20" font-weight="bold" fill="#376b47">老年人就业</text><text x="455" y="278" font-family="sans-serif" font-size="58" font-weight="bold" fill="#27623d">943 万</text><text x="455" y="318" font-family="sans-serif" font-size="17" fill="#4c7658">65 岁以上就业人数</text><text x="455" y="355" font-family="sans-serif" font-size="15" fill="#5a8566">2026 年敬老日专题</text><text x="455" y="397" font-family="sans-serif" font-size="15" fill="#5a8566">不是新增加的岗位数量</text>
<rect x="802" y="151" width="337" height="300" rx="19" fill="#fff0df" stroke="#e4b17e"/><text x="826" y="198" font-family="sans-serif" font-size="20" font-weight="bold" fill="#8e5b27">外国劳动者</text><text x="826" y="278" font-family="sans-serif" font-size="58" font-weight="bold" fill="#96621d">257 万</text><text x="826" y="318" font-family="sans-serif" font-size="17" fill="#875f3a">雇主申报的就业人数</text><text x="826" y="355" font-family="sans-serif" font-size="15" fill="#9c764d">2025 年 10 月末数据</text><text x="826" y="397" font-family="sans-serif" font-size="15" fill="#9c764d">不是全部移民人口</text>
<rect x="60" y="478" width="1079" height="59" rx="13" fill="#eaf0f6"/><text x="78" y="505" font-family="sans-serif" font-size="16" font-weight="bold" fill="#304865">不相同的指标不能相加，年份不同也不能自行合成为 2026 年的“劳动力缺口”。</text><text x="78" y="527" font-family="sans-serif" font-size="13" fill="#687c91">数据：总务省统计局 2026 年人口及敬老日统计专题；厚生劳动省 2026-01-30 公告。</text></svg>