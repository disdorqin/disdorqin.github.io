<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="日本老年人口占比：2026年已观察值29.5%，2070年特定中位假设的推计38.7%，两个数据性质不同">
<rect width="1200" height="540" rx="28" fill="#122237"/><text x="58" y="71" font-family="sans-serif" font-size="30" font-weight="700" fill="#f5f9ff">人口老龄化：观察值 ≠ 未来必然值</text><text x="60" y="112" font-family="sans-serif" font-size="16" fill="#b5c8df">日本 65 岁以上人口占比；2026 为人口推计观测值，2070 为长期情景推计</text>
<g><rect x="94" y="177" width="465" height="255" rx="21" fill="#243d5e" stroke="#69b2df" stroke-width="2"/><text x="126" y="215" font-family="sans-serif" font-size="21" font-weight="700" fill="#8cdaff">2026 年官方统计</text><text x="126" y="300" font-family="sans-serif" font-size="78" font-weight="bold" fill="#ffffff">29.5%</text><text x="126" y="340" font-family="sans-serif" font-size="18" fill="#d2e5fa">65 岁以上约 3615.5 万人</text><text x="126" y="385" font-family="sans-serif" font-size="16" fill="#9cc4e3">已公布观察结果</text></g>
<g><rect x="639" y="177" width="465" height="255" rx="21" fill="#423a51" stroke="#bea2df" stroke-width="2" stroke-dasharray="8 5"/><text x="671" y="215" font-family="sans-serif" font-size="21" font-weight="700" fill="#d7bff9">2070 年人口研究所推计</text><text x="671" y="300" font-family="sans-serif" font-size="78" font-weight="bold" fill="#ffffff">38.7%</text><text x="671" y="340" font-family="sans-serif" font-size="18" fill="#e5d9f2">中位生育 / 中位死亡情景</text><text x="671" y="385" font-family="sans-serif" font-size="16" fill="#c7b3dd">不是已发生的数据</text></g>
<text x="58" y="487" font-family="sans-serif" font-size="16" fill="#c8d8e9">来源：日本总务省统计局 2026-11-20；国立社会保障·人口问题研究所 2023 年修订推计。</text><text x="58" y="515" font-family="sans-serif" font-size="14" fill="#8aa3bc">人口预测会随生育、寿命和净迁移假设改变；本图不把两点连线当作真实历史轨迹。</text></svg>