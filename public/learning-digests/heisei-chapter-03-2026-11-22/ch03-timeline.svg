<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-label="日本金融危机时间线：住专救助、三洋证券和山一倒闭、长期信用银行国有化等关键事件">
<rect width="1200" height="610" rx="26" fill="#14263c"/>
<text x="54" y="70" fill="#f4f7fc" font-family="sans-serif" font-size="30" font-weight="bold">风险不是在宣布倒闭那一天才出现</text>
<text x="56" y="110" fill="#bfd0e3" font-family="sans-serif" font-size="17">日本 1990 年代金融危机：损失隐藏、市场信心与制度处置的时间差</text>
<path d="M112 297 H1091" stroke="#587692" stroke-width="7" stroke-linecap="round"/>
<g font-family="sans-serif" text-anchor="middle">
<circle cx="158" cy="297" r="14" fill="#83c4ed"/><text x="158" y="270" fill="#e7f4ff" font-size="22" font-weight="bold">1994–95</text>
<rect x="58" y="338" width="201" height="106" rx="14" fill="#274761"/><text x="158" y="379" fill="#ecf6ff" font-size="18">信用组合问题</text><text x="158" y="406" fill="#ecf6ff" font-size="18">住专坏账暴露</text>
<circle cx="393" cy="297" r="14" fill="#ecb373"/><text x="393" y="270" fill="#ffe4c3" font-size="22" font-weight="bold">1996</text>
<rect x="294" y="153" width="201" height="100" rx="14" fill="#66502e"/><text x="393" y="193" fill="#ffe9c9" font-size="18">住专救助争论</text><text x="393" y="222" fill="#ffe9c9" font-size="18">国会处理方案</text>
<circle cx="634" cy="297" r="14" fill="#ee8585"/><text x="634" y="270" fill="#ffdddd" font-size="22" font-weight="bold">1997.11</text>
<rect x="529" y="338" width="214" height="106" rx="14" fill="#653d4d"/><text x="636" y="379" fill="#ffe7e7" font-size="18">拓银与山一退出</text><text x="636" y="408" fill="#ffe7e7" font-size="18">信心危机扩散</text>
<circle cx="866" cy="297" r="14" fill="#b8a2ee"/><text x="866" y="270" fill="#e5d9ff" font-size="22" font-weight="bold">1998</text>
<rect x="765" y="153" width="203" height="100" rx="14" fill="#4e436d"/><text x="866" y="192" fill="#eee8ff" font-size="18">金融再生法</text><text x="866" y="220" fill="#eee8ff" font-size="18">长银等国有化</text>
<circle cx="1077" cy="297" r="14" fill="#93d0b4"/><text x="1077" y="270" fill="#e1fff1" font-size="22" font-weight="bold">2000</text>
<rect x="965" y="338" width="190" height="106" rx="14" fill="#2a5b4a"/><text x="1060" y="379" fill="#ecfff5" font-size="17">长银改组</text><text x="1060" y="405" fill="#ecfff5" font-size="17">新生银行</text>
</g><g stroke="#829cb6" stroke-width="2"><line x1="158" y1="314" x2="158" y2="336"/><line x1="393" y1="278" x2="393" y2="253"/><line x1="634" y1="314" x2="634" y2="336"/><line x1="866" y1="278" x2="866" y2="253"/><line x1="1077" y1="314" x2="1077" y2="336"/></g>
<rect x="54" y="484" width="1095" height="78" rx="15" fill="#213a54"/><text x="78" y="515" fill="#f0f6fc" font-family="sans-serif" font-size="19" font-weight="bold">危机有两个时钟：损失出现的时间，和社会承认损失的时间。</text><text x="78" y="546" fill="#bbd1e4" font-family="sans-serif" font-size="14">来源：野口中文版第 3 章、日本银行 1997 年声明、内阁府金融再生制度记录；图示为事件排序。</text>
</svg>