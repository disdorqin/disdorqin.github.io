<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="从组织风险到个人行动的两层框架：金融风险出现、损失隐藏、信心受损，与个人现金流和技能迁移的可控行动">
<rect width="1200" height="600" rx="26" fill="#132338"/><text x="55" y="69" font-family="sans-serif" fill="#f5f9fe" font-size="30" font-weight="bold">机构会失败，个人如何避免被一个错误拖住？</text><text x="57" y="107" font-family="sans-serif" fill="#b5cadd" font-size="17">不是用个人储蓄替代金融监管，而是在制度与生活两层建立纠错能力</text>
<g font-family="sans-serif"><rect x="55" y="156" width="515" height="317" rx="20" fill="#29425d" stroke="#729fc5"/><text x="80" y="200" fill="#add7f4" font-size="23" font-weight="bold">制度层：风险如何扩散？</text>
<text x="80" y="260" fill="#f4f8ff" font-size="20">资产价值下跌</text><text x="80" y="302" fill="#f4f8ff" font-size="20">→ 延迟确认损失</text><text x="80" y="344" fill="#f4f8ff" font-size="20">→ 资本与流动性受压</text><text x="80" y="386" fill="#f4f8ff" font-size="20">→ 信心与支付网络受损</text><text x="80" y="440" fill="#b9d8ee" font-size="16">需要披露、监督、重组和有序退出制度</text>
<rect x="628" y="156" width="516" height="317" rx="20" fill="#285144" stroke="#83c5ab"/><text x="654" y="200" fill="#b4f1db" font-size="23" font-weight="bold">个人层：能够控制什么？</text>
<text x="654" y="260" fill="#f4f8ff" font-size="20">了解现金流和还款期限</text><text x="654" y="302" fill="#f4f8ff" font-size="20">保留必要的流动性缓冲</text><text x="654" y="344" fill="#f4f8ff" font-size="20">谨慎识别组织经营风险</text><text x="654" y="386" fill="#f4f8ff" font-size="20">建立可转移技能与备选路径</text><text x="654" y="440" fill="#c4eddf" font-size="16">个人可以降低暴露，但不能消灭系统风险</text></g>
<rect x="56" y="510" width="1088" height="56" rx="14" fill="#20374d"/><text x="76" y="545" font-family="sans-serif" font-size="17" fill="#e0effc">可复核的组织和个人计划，比“永远相信一家机构不会倒”更可靠。</text>
<text x="1130" y="585" text-anchor="end" font-family="sans-serif" font-size="13" fill="#7e9ab6">原创研究示意｜野口第 3 章及日银、内阁府历史材料</text>
</svg>