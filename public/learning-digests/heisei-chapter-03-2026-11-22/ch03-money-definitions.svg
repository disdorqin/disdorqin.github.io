<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-label="金融稳定资金的政策授权、实际投入、公共负担和原著税收假设不是同一会计概念，不可直接相加">
<rect width="1200" height="610" rx="26" fill="#f8fafc"/><text x="54" y="66" fill="#1f3249" font-family="sans-serif" font-size="31" font-weight="bold">救银行“花了多少钱”？先统一口径</text><text x="56" y="105" fill="#687b90" font-family="sans-serif" font-size="17">不同金额回答不同的问题，不能画成同一条“财政损失”柱状图</text>
<g font-family="sans-serif"><rect x="53" y="152" width="538" height="157" rx="19" fill="#e6f0fa" stroke="#98bbdd"/><text x="77" y="191" font-size="19" font-weight="bold" fill="#316288">政策授权规模</text><text x="77" y="253" font-size="51" font-weight="bold" fill="#245986">约 60 万亿日元</text><text x="77" y="286" font-size="15" fill="#5b7590">1998 年安排规模，不等于全部已用</text>
<rect x="612" y="152" width="536" height="157" rx="19" fill="#e8f3ed" stroke="#a2c9b0"/><text x="636" y="191" font-size="19" font-weight="bold" fill="#367353">公共资金投入</text><text x="636" y="253" font-size="51" font-weight="bold" fill="#2c6b48">约 47 万亿日元</text><text x="636" y="286" font-size="15" fill="#61816d">特定统计期间与口径；部分可回收</text>
<rect x="53" y="330" width="538" height="157" rx="19" fill="#fbefdf" stroke="#e6be8f"/><text x="77" y="369" font-size="19" font-weight="bold" fill="#8b642e">公共负担 / 净成本</text><text x="77" y="431" font-size="51" font-weight="bold" fill="#92632a">约 10 万亿日元</text><text x="77" y="464" font-size="15" fill="#9a7a4f">需核统计范围、回收和结算时点</text>
<rect x="612" y="330" width="536" height="157" rx="19" fill="#f3ebf4" stroke="#bba1c1" stroke-dasharray="8 5"/><text x="636" y="369" font-size="19" font-weight="bold" fill="#7a5480">书中条件假设的税收估算</text><text x="636" y="431" font-size="51" font-weight="bold" fill="#7c4f87">约 39 万亿日元</text><text x="636" y="464" font-size="15" fill="#927397">非已核实财政损失；不可与前项直接相加</text></g>
<text x="57" y="532" font-family="sans-serif" font-size="18" fill="#334b62" font-weight="bold">注：不是四个互斥的会计项目，不能计算总和。</text><text x="57" y="563" font-family="sans-serif" font-size="14" fill="#6a7d90">来源：日本内阁府 2009、金融厅公共资金 FAQ、IMF 2009；39 万亿取自原著强假设。</text>
</svg>