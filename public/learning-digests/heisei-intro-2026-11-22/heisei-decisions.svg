<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="从日本经验到青年决策的证据链示意，分别标示历史事实、机制、适用条件和个人行动">
<rect width="1200" height="540" rx="28" fill="#102033"/>
<text x="56" y="68" font-family="sans-serif" font-size="30" font-weight="bold" fill="#f8fbff">从历史到个人选择：四道不能跳过的判断</text><text x="58" y="104" font-family="sans-serif" font-size="16" fill="#b9cbe0">证据推理流程示意｜不是“日本发生什么，中国就必然发生什么”</text>
<g font-family="sans-serif"><rect x="55" y="155" width="254" height="220" rx="22" fill="#203c5d" stroke="#4d8cb7"/><text x="75" y="195" font-size="23" font-weight="bold" fill="#a4d3ff">01  历史事实</text><text x="75" y="232" font-size="18" fill="#f4f6fa">何时发生？</text><text x="75" y="260" font-size="18" fill="#f4f6fa">谁受到影响？</text><text x="75" y="288" font-size="18" fill="#f4f6fa">采用何种指标？</text><text x="75" y="330" font-size="14" fill="#bbd8f3">官方统计与原书区分</text>
<rect x="343" y="155" width="254" height="220" rx="22" fill="#23444d" stroke="#61b6a5"/><text x="364" y="195" font-size="23" font-weight="bold" fill="#abeadd">02  机制解释</text><text x="364" y="232" font-size="18" fill="#f4f6fa">资产负债表？</text><text x="364" y="260" font-size="18" fill="#f4f6fa">技术更替？</text><text x="364" y="288" font-size="18" fill="#f4f6fa">政策与人口？</text><text x="364" y="330" font-size="14" fill="#bae3d8">纳入不同学界观点</text>
<rect x="631" y="155" width="254" height="220" rx="22" fill="#4a3c42" stroke="#db9e80"/><text x="651" y="195" font-size="23" font-weight="bold" fill="#ffd6b6">03  中国对照</text><text x="651" y="232" font-size="18" fill="#f4f6fa">统计口径相同吗？</text><text x="651" y="260" font-size="18" fill="#f4f6fa">制度和产业一样吗？</text><text x="651" y="288" font-size="18" fill="#f4f6fa">哪些不能外推？</text><text x="651" y="330" font-size="14" fill="#fbd5c0">不做宿命论预测</text>
<rect x="919" y="155" width="227" height="220" rx="22" fill="#3d3d5b" stroke="#a8a6e3"/><text x="940" y="195" font-size="23" font-weight="bold" fill="#dfd6ff">04  个人行动</text><text x="940" y="232" font-size="18" fill="#f4f6fa">储备可迁移技能</text><text x="940" y="260" font-size="18" fill="#f4f6fa">控制不可逆负债</text><text x="940" y="288" font-size="18" fill="#f4f6fa">保留职业选择权</text><text x="940" y="330" font-size="14" fill="#dddcfc">按个人条件审慎决策</text></g>
<g fill="#d8ebff"><path d="M320 257 l13 10 -13 10z"/><path d="M608 257 l13 10 -13 10z"/><path d="M896 257 l13 10 -13 10z"/></g>
<rect x="56" y="413" width="1088" height="69" rx="14" fill="#1b3048"/><text x="77" y="440" font-family="sans-serif" font-size="19" font-weight="bold" fill="#f6f8fb">真正的历史借鉴不是替你决定“考研还是就业”</text><text x="77" y="464" font-family="sans-serif" font-size="16" fill="#c9d9eb">而是帮助你判断：哪项投入可逆、哪种风险可承受、哪些证据仍然缺失。</text>
<text x="1130" y="520" font-family="sans-serif" font-size="13" text-anchor="end" fill="#7c91a8">原创论证示意 · 2026-11-22</text>
</svg>