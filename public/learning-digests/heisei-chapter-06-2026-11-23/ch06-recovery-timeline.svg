<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="日本2008至2010年出口冲击与政策恢复的时间轴，分别标出全球金融危机、2008年11月中国刺激、2009年日本出口急跌与恢复、美国2008年11月启动QE1及2010年11月QE2">
<rect width="1200" height="600" rx="26" fill="#132238"/><text x="53" y="70" font-family="sans-serif" font-size="31" font-weight="bold" fill="#f4f9ff">冲击来自全球，恢复也来自多个渠道</text><text x="55" y="110" font-family="sans-serif" font-size="16" fill="#bbcee4">2008—2010｜官方事实节点，时间重叠不代表某一政策解释全部恢复</text>
<path d="M110 296 H1090" stroke="#7891ae" stroke-width="7" stroke-linecap="round"/>
<g font-family="sans-serif" text-anchor="middle">
<circle cx="142" cy="296" r="14" fill="#e89991"/><text x="142" y="268" fill="#ffdad7" font-size="19" font-weight="bold">2008.09</text>
<rect x="57" y="338" width="171" height="103" rx="14" fill="#683e42"/><text x="143" y="375" fill="#fff0ef" font-size="17">雷曼破产</text><text x="143" y="403" fill="#ffd4d0" font-size="16">世界订单下降</text>
<circle cx="356" cy="296" r="14" fill="#e7c278"/><text x="356" y="268" fill="#fff1c7" font-size="19" font-weight="bold">2008.11</text>
<rect x="265" y="129" width="183" height="116" rx="14" fill="#65532f"/><text x="356" y="170" fill="#fff4dc" font-size="17">中国公布</text><text x="356" y="198" fill="#fff4dc" font-size="17">四万亿元计划</text><text x="356" y="225" fill="#f6dfb4" font-size="14">美联储启动QE1</text>
<circle cx="571" cy="296" r="14" fill="#93b8ec"/><text x="571" y="268" fill="#dceaff" font-size="19" font-weight="bold">2009.H1</text>
<rect x="473" y="338" width="196" height="103" rx="14" fill="#29486b"/><text x="571" y="372" fill="#f4f9ff" font-size="17">日本出口总额</text><text x="571" y="402" fill="#d9eaff" font-size="18" font-weight="bold">同比 −42.7%</text>
<circle cx="787" cy="296" r="14" fill="#8acdb0"/><text x="787" y="268" fill="#d3f9e8" font-size="19" font-weight="bold">2009.H2</text>
<rect x="692" y="129" width="190" height="116" rx="14" fill="#2a594b"/><text x="787" y="168" fill="#eafff3" font-size="17">对华部分机械</text><text x="787" y="198" fill="#eafff3" font-size="17">和设备订单恢复</text><text x="787" y="224" fill="#c1edd7" font-size="14">日本购买支持措施</text>
<circle cx="1005" cy="296" r="14" fill="#c6a4e8"/><text x="1005" y="268" fill="#ead6ff" font-size="19" font-weight="bold">2010.11</text>
<rect x="907" y="338" width="196" height="103" rx="14" fill="#56476c"/><text x="1005" y="375" fill="#faf3ff" font-size="18">美联储 QE2</text><text x="1005" y="403" fill="#e6d4fb" font-size="16">购买国债</text></g>
<rect x="56" y="476" width="1088" height="79" rx="15" fill="#1e364f"/>
<text x="79" y="510" font-family="sans-serif" font-size="19" font-weight="bold" fill="#e9f5ff">政策宣布 ≠ 一次性财政支付；月度反弹 ≠ 全年已经恢复。</text>
<text x="79" y="536" font-family="sans-serif" font-size="14" fill="#bed3e4">来源：RIETI、日本银行、IMF、中国刺激计划历史资料、纽约联储 QE 归档。</text>
</svg>