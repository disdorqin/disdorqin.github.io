<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="日本2009年经济恢复来自中国投资需求和日本国内消费及就业支持的两条不同机制。仅为理论传导渠道，不代表已识别的份额。">
<rect width="1200" height="620" rx="26" fill="#f9fbfd"/><text x="54" y="68" font-family="sans-serif" font-size="29" font-weight="bold" fill="#1f334c">同样叫“复苏”，两个渠道完全不同</text><text x="56" y="106" font-family="sans-serif" font-size="16" fill="#65798e">研究问题：哪些订单来自境外投资？哪些需求由国内购买补贴支持？</text>
<rect x="58" y="145" width="510" height="361" rx="21" fill="#e5f1fc" stroke="#83b9e5" stroke-width="2"/><rect x="631" y="145" width="511" height="361" rx="21" fill="#e8f5eb" stroke="#87c8a1" stroke-width="2"/>
<g font-family="sans-serif"><text x="83" y="189" font-size="22" font-weight="bold" fill="#285d8a">通道 A｜中国投资需求</text><text x="656" y="189" font-size="22" font-weight="bold" fill="#2b754b">通道 B｜日本国内政策</text>
<rect x="99" y="220" width="418" height="65" rx="14" fill="#ffffff" stroke="#b9d9f0"/><text x="121" y="260" font-size="20" fill="#315c7b">基础设施与制造业投资</text>
<rect x="99" y="330" width="418" height="65" rx="14" fill="#ffffff" stroke="#b9d9f0"/><text x="121" y="370" font-size="20" fill="#315c7b">日本机械与零部件订单</text>
<rect x="670" y="220" width="418" height="65" rx="14" fill="#ffffff" stroke="#b8dec3"/><text x="693" y="260" font-size="19" fill="#326b45">环保车税惠、购买和就业支持</text>
<rect x="670" y="330" width="418" height="65" rx="14" fill="#ffffff" stroke="#b8dec3"/><text x="693" y="370" font-size="19" fill="#326b45">部分购车需求与企业用工稳定</text>
<text x="122" y="466" font-size="17" fill="#4d7293">海关分商品、终端用途需进一步区分</text><text x="693" y="466" font-size="17" fill="#518269">补贴效果须检验需求提前与挤出</text></g>
<g stroke-width="4" stroke-linecap="round" fill="none"><path d="M309 286 V326" stroke="#3a80b8"/><path d="M880 286 V326" stroke="#4a9871"/></g><g fill="#3a80b8"><path d="M300 317 L309 330 L318 317z"/></g><g fill="#4a9871"><path d="M871 317 L880 330 L889 317z"/></g>
<rect x="57" y="534" width="1086" height="55" rx="14" fill="#223b54"/><text x="83" y="568" font-family="sans-serif" font-size="18" fill="#eef7ff" font-weight="bold">两条渠道都可能起作用，但贡献率和长期效果都不能只靠前后对比判断。</text>
</svg>