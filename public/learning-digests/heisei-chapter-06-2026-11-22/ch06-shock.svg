<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 575" role="img" aria-label="日本2008二季度至2009一季度出口下降约40%、工业生产下降约30%，两者统计指标不同，不能与GDP折年率混同">
<rect width="1200" height="575" rx="26" fill="#14263a"/><text x="55" y="69" fill="#f5faff" font-family="sans-serif" font-size="30" font-weight="bold">全球需求骤降：日本工业链为何如此敏感？</text><text x="57" y="106" fill="#b8cfe3" font-family="sans-serif" font-size="16">2008 年第二季度 → 2009 年第一季度，日本银行历史统计（阶段变化）</text>
<rect x="60" y="166" width="506" height="280" rx="22" fill="#5d4144" stroke="#e99a92" stroke-width="2"/><rect x="634" y="166" width="507" height="280" rx="22" fill="#2a4f6a" stroke="#8bc2df" stroke-width="2"/>
<g font-family="sans-serif"><text x="87" y="217" fill="#ffcfcc" font-size="24" font-weight="bold">出口额 / 数量相关统计</text><text x="87" y="329" fill="#fdf4f3" font-size="82" font-weight="bold">−40%</text><text x="87" y="383" fill="#eac1bd" font-size="18">日本银行阶段统计</text>
<text x="661" y="217" fill="#cae8ff" font-size="24" font-weight="bold">工业生产</text><text x="661" y="329" fill="#f7fcff" font-size="82" font-weight="bold">−30%</text><text x="661" y="383" fill="#c2e0f1" font-size="18">制造与库存双重调整</text></g>
<rect x="57" y="478" width="1087" height="60" rx="12" fill="#233c53"/><text x="76" y="505" fill="#f1f8ff" font-family="sans-serif" font-size="17" font-weight="bold">不同序列的跌幅不等于 GDP 同比，不可与季环比折年率 −14% 直接混算。</text><text x="76" y="527" fill="#b8cede" font-family="sans-serif" font-size="13">来源：日本银行 2009 年 6 月经济演讲；IMF 2009 Article IV 咨询。</text></svg>