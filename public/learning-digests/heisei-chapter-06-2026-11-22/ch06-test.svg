<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-label="检验企业恢复是否形成长期竞争力的四步流程：经营结果、外部支持、能力变化、压力测试">
<rect width="1200" height="590" rx="25" fill="#17263a"/><text x="54" y="69" fill="#f4f9ff" font-family="sans-serif" font-size="30" font-weight="bold">看起来恢复了，真的完成了转型吗？</text><text x="56" y="108" fill="#bed0e6" font-family="sans-serif" font-size="16">先记录可以观察的变化，再给强结论设置反证条件</text>
<g font-family="sans-serif"><rect x="52" y="166" width="260" height="284" rx="20" fill="#264a6e" stroke="#84bfe9"/><rect x="332" y="166" width="260" height="284" rx="20" fill="#51455b" stroke="#bfa4d6"/><rect x="612" y="166" width="260" height="284" rx="20" fill="#4d5037" stroke="#cfcc88"/><rect x="892" y="166" width="260" height="284" rx="20" fill="#285345" stroke="#8ed9b6"/>
<text x="78" y="205" fill="#b4dfff" font-size="21" font-weight="bold">1 经营恢复</text><text x="78" y="257" fill="#f2f8ff" font-size="18">销售、利润、</text><text x="78" y="290" fill="#f2f8ff" font-size="18">库存与现金流</text><text x="78" y="387" fill="#b4d3ea" font-size="15">发生了什么？</text>
<text x="358" y="205" fill="#e6c8ff" font-size="21" font-weight="bold">2 外部支持</text><text x="358" y="257" fill="#f2f8ff" font-size="18">补贴、汇率、</text><text x="358" y="290" fill="#f2f8ff" font-size="18">全球订单变化</text><text x="358" y="387" fill="#d4c5e0" font-size="15">什么推动改善？</text>
<text x="638" y="205" fill="#f3efb1" font-size="21" font-weight="bold">3 结构能力</text><text x="638" y="257" fill="#f2f8ff" font-size="18">技术、组织、</text><text x="638" y="290" fill="#f2f8ff" font-size="18">新产品与客户</text><text x="638" y="387" fill="#d8d7ae" font-size="15">留下了什么？</text>
<text x="918" y="205" fill="#b6f3d7" font-size="21" font-weight="bold">4 压力测试</text><text x="918" y="257" fill="#f2f8ff" font-size="18">去除政策、</text><text x="918" y="290" fill="#f2f8ff" font-size="18">汇率与单一客户</text><text x="918" y="387" fill="#b7e2cb" font-size="15">还能持续吗？</text></g>
<rect x="55" y="494" width="1090" height="63" rx="15" fill="#253d54"/><text x="77" y="523" fill="#e8f5ff" font-family="sans-serif" font-size="18" font-weight="bold">一时的增长不能替代因果识别，但也不等于真实获得的收入没有价值。</text><text x="77" y="547" fill="#bed4e8" font-family="sans-serif" font-size="14">原创研究框架；依据野口第 6 章与 BOJ/IMF/METI 相关历史证据设计。</text></svg>