<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-label="中国投资刺激和日本汽车及就业补贴通过不同路径帮助日本制造业，不代表已量化各项政策的因果贡献">
<rect width="1200" height="590" rx="26" fill="#f7fafc"/><text x="54" y="68" fill="#22374f" font-family="sans-serif" font-size="30" font-weight="bold">谁在托住日本制造业？两条不同的需求链</text><text x="57" y="105" fill="#62778e" font-family="sans-serif" font-size="17">政策实施→需求与融资→制造业订单；每一步都需要独立证据</text>
<rect x="58" y="151" width="516" height="331" rx="19" fill="#e2effa" stroke="#89b7dc" stroke-width="2"/><rect x="626" y="151" width="516" height="331" rx="19" fill="#e8f3eb" stroke="#9bc8a9" stroke-width="2"/>
<g font-family="sans-serif"><text x="86" y="199" fill="#285e90" font-size="23" font-weight="bold">外部渠道：中国 2008 年投资刺激</text><text x="86" y="252" fill="#3b536e" font-size="20">基础设施与城市开发</text><text x="86" y="299" fill="#3b536e" font-size="20">→ 机床、工程机械等采购需求</text><text x="86" y="346" fill="#3b536e" font-size="20">→ 可能提升日本对华出口</text><text x="86" y="405" fill="#6d8dac" font-size="16">外部复苏与政策影响需分离</text>
<text x="653" y="199" fill="#357650" font-size="23" font-weight="bold">内部渠道：日本消费与就业支持</text><text x="653" y="252" fill="#405d4d" font-size="20">汽车购买减税与补助</text><text x="653" y="299" fill="#405d4d" font-size="20">→ 短期购车需求</text><text x="653" y="346" fill="#405d4d" font-size="20">→ 稳定产能与部分岗位</text><text x="653" y="405" fill="#6b9b7d" font-size="16">提前消费不等于净新增销量</text></g>
<rect x="57" y="514" width="1084" height="45" rx="12" fill="#e9edf2"/><text x="75" y="542" fill="#51677e" font-family="sans-serif" font-size="16">基础事实：2008-11 中国宣布约 4 万亿元总投资计划；日本出台汽车及雇佣调整支持。</text></svg>