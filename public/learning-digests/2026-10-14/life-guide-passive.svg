<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-label="用户级Codex全局被动Skill触发与普通网页ChatGPT区别">
<rect width="1200" height="690" fill="#f7f9fd"/><text x="63" y="76" font-size="32" fill="#163449" font-weight="700">“被动提醒”究竟由谁保证？</text><text x="63" y="114" font-size="19" fill="#6b7c8e">安装文件、配置全局指令、每轮实际检索，属于三个不同层级</text>
<g font-family="Arial, Noto Sans CJK SC, sans-serif">
<rect x="62" y="151" width="525" height="392" rx="23" fill="#eaf4ff" stroke="#7ca9d5" stroke-width="2"/><text x="94" y="193" font-size="26" fill="#245a83" font-weight="700">Codex 本机路径</text>
<rect x="101" y="226" width="450" height="71" rx="12" fill="#fff" stroke="#9cbfdf"/><text x="120" y="257" font-size="22" fill="#285f87">① 安装完整 Skill 文件夹</text><text x="120" y="283" font-size="17" fill="#527d9d">SKILL.md + knowledge-base + scripts</text>
<rect x="101" y="323" width="450" height="71" rx="12" fill="#fff" stroke="#9cbfdf"/><text x="120" y="354" font-size="22" fill="#285f87">② 配置 AGENTS.md 全局触发</text><text x="120" y="380" font-size="17" fill="#527d9d">明确可撤销，保留原有用户配置</text>
<rect x="101" y="420" width="450" height="90" rx="12" fill="#fff" stroke="#9cbfdf"/><text x="120" y="451" font-size="22" fill="#285f87">③ 新会话 → 读 Skill → 检索</text><text x="120" y="481" font-size="18" fill="#527d9d">宿主仍需遵守指令，逐轮核验是否触发</text>
<rect x="622" y="151" width="516" height="392" rx="23" fill="#fff3e8" stroke="#e2ad7e" stroke-width="2"/><text x="655" y="193" font-size="26" fill="#86552b" font-weight="700">网页端 ChatGPT 路径</text>
<rect x="660" y="226" width="442" height="71" rx="12" fill="#fff" stroke="#e5c5a5"/><text x="680" y="259" font-size="21" fill="#915b2c">① 网页端本身不读取用户C盘</text><text x="680" y="285" font-size="17" fill="#9c7759">本机 Codex 的安装不会自动同步</text>
<rect x="660" y="323" width="442" height="71" rx="12" fill="#fff" stroke="#e5c5"/><text x="680" y="355" font-size="21" fill="#915b2c">② 需经授权的 MCP / DevSpace</text><text x="680" y="381" font-size="17" fill="#9c7759">连接才能发现与读取本机 Skill</text>
<rect x="660" y="420" width="442" height="90" rx="12" fill="#fff" stroke="#e5c5"/><text x="680" y="451" font-size="21" fill="#915b2c">③ 自动注入需要宿主配合</text><text x="680" y="481" font-size="17" fill="#9c7759">工具可读取 ≠ 每条聊天都强制触发</text>
<rect x="62" y="581" width="1076" height="65" rx="14" fill="#203e56"/><text x="92" y="621" font-size="21" fill="#ebf2f7">验收应核对：发现成功率 · 每轮触发率 · 选条相关性 · 时间与隐私代价</text>
</g></svg>