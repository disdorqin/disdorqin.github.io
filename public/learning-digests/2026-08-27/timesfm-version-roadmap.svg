<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">TimesFM 与 Chronos 时序模型版本演进</title><desc id="d">TimesFM 2.5于2025年九月出现更长历史窗口和概率头，3.0于2026年八月提供原生多变量与未来协变量接口。Chronos-2在2025年十月发布，也是比较对象。该图不是准确率排名。</desc><rect width="1200" height="700" rx="24" fill="#f7f9fd"/><rect x="33" y="30" width="1134" height="637" rx="28" fill="#fff" stroke="#e0e8f2" stroke-width="2"/><text x="70" y="88" font-family="sans-serif" font-size="36" font-weight="bold" fill="#243e5b">时序基础模型：先比较能力，不要先比较排名</text><text x="70" y="129" font-family="sans-serif" font-size="20" fill="#677e97">官方版本公开记录，横轴是发布时间；不同产品的输入接口不应混为同一实验</text><line x1="109" y1="350" x2="1091" y2="350" stroke="#8da3bf" stroke-width="5"/><g font-family="sans-serif"><circle cx="235" cy="350" r="15" fill="#4d8bc9"/><circle cx="602" cy="350" r="15" fill="#4d8bc9"/><circle cx="983" cy="350" r="15" fill="#4d8bc9"/><text x="235" y="393" font-size="20" fill="#526981" text-anchor="middle">2025 / 09</text><text x="602" y="393" font-size="20" fill="#526981" text-anchor="middle">2025 / 10</text><text x="983" y="393" font-size="20" fill="#526981" text-anchor="middle">2026 / 08</text><rect x="95" y="181" width="287" height="134" rx="18" fill="#e4efff" stroke="#92b7e2" stroke-width="2"/><text x="125" y="229" font-size="28" font-weight="bold" fill="#255a9a">TimesFM 2.5</text><text x="125" y="267" font-size="19" fill="#4c76a5">200M 参数 / 16k 上下文</text><text x="125" y="293" font-size="18" fill="#4c76a5">可选分位数头</text><rect x="449" y="440" width="308" height="144" rx="18" fill="#e5f4eb" stroke="#9acbab" stroke-width="2"/><text x="478" y="485" font-size="28" font-weight="bold" fill="#276e48">Chronos-2</text><text x="478" y="524" font-size="19" fill="#4c8766">单变量 / 多变量</text><text x="478" y="551" font-size="18" fill="#4c8766">带协变量的零样本预测</text><rect x="810" y="181" width="320" height="134" rx="18" fill="#f2e9ff" stroke="#c0a8e4" stroke-width="2"/><text x="842" y="229" font-size="28" font-weight="bold" fill="#6b4c9c">TimesFM 3.0</text><text x="842" y="267" font-size="19" fill="#8466aa">原生多变量联合预测</text><text x="842" y="293" font-size="18" fill="#8466aa">历史 / 未来协变量接口</text><path d="M235 315 V334 M602 366 V428 M983 315 V334" fill="none" stroke="#8aa2b9" stroke-width="3"/><rect x="92" y="614" width="1035" height="39" rx="10" fill="#e9eef4"/><text x="111" y="640" font-size="18" fill="#58728c">版本能力变化 ≠ 新市场实测效果；权重许可、输入时间语义与基准口径必须另审。</text></g></svg>