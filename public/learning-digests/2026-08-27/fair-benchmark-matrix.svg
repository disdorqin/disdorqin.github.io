<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="t d"><title id="t">基础模型研究的三因素公平比较框架</title><desc id="d">将模型版本、合法输入和模型适配分成三个独立因素，在相同预测起点与评价指标上比较，不能把输入信息收益归因于架构。</desc><rect width="1200" height="730" rx="24" fill="#f7f9fc"/><text x="58" y="78" font-family="sans-serif" font-size="35" font-weight="bold" fill="#1f3d5a">要解释效果来源，先拆开三个会同时变化的因素</text><text x="60" y="116" font-family="sans-serif" font-size="20" fill="#6e8295">对照矩阵不提供真实结果；它告诉我们应该如何设计公平实验</text><g font-family="sans-serif" text-anchor="middle"><rect x="72" y="183" width="318" height="162" rx="19" fill="#e5effe" stroke="#96b8e1" stroke-width="2"/><text x="231" y="230" font-size="28" font-weight="bold" fill="#2a6097">因素 A：模型</text><text x="231" y="270" font-size="20" fill="#567da7">TimesFM 2.5 / 3.0</text><text x="231" y="303" font-size="20" fill="#567da7">Chronos-2 / 简单基线</text><rect x="441" y="183" width="318" height="162" rx="19" fill="#e6f5ed" stroke="#9cc8ac" stroke-width="2"/><text x="600" y="230" font-size="28" font-weight="bold" fill="#2c714b">因素 B：信息</text><text x="600" y="270" font-size="20" fill="#58866c">只用合法历史</text><text x="600" y="303" font-size="20" fill="#58866c">额外加入已发布协变量</text><rect x="810" y="183" width="318" height="162" rx="19" fill="#fff0dc" stroke="#d7b58d" stroke-width="2"/><text x="969" y="230" font-size="28" font-weight="bold" fill="#8c5a2a">因素 C：适配</text><text x="969" y="270" font-size="20" fill="#a07953">纯零样本</text><text x="969" y="303" font-size="20" fill="#a07953">验证选型 / 微调</text></g><g stroke="#7d93aa" stroke-width="3" fill="none"><path d="M231 345 V396 H600 V421"/><path d="M600 345 V421"/><path d="M969 345 V396 H600 V421"/></g><rect x="183" y="431" width="834" height="108" rx="20" fill="#e8edf5" stroke="#c7d5e4" stroke-width="2"/><text x="600" y="471" font-size="25" text-anchor="middle" font-family="sans-serif" fill="#2d4d6e" font-weight="bold">固定同一预测起点、真实目标、指标和可比样本</text><text x="600" y="512" font-size="20" text-anchor="middle" font-family="sans-serif" fill="#60778d">逐月、逐跨度、负价与尖峰分组检查；同时记录时间与许可</text><rect x="73" y="586" width="1055" height="83" rx="18" fill="#223e59"/><text x="103" y="625" font-size="23" font-weight="bold" font-family="sans-serif" fill="#fff">某模型不支持某输入方案 → 标注不适用；不可补造一个分数。</text><text x="103" y="651" font-size="18" font-family="sans-serif" fill="#bdd4e7">此图体现实验设计，不代表本篇已运行对照或证实某一版本领先。</text></svg>