<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="t d"><title id="t">预测时点的合法输入与非法未来值</title><desc id="d">周一06点的未来天气预报可在周一10点的预测时使用，12点的修订版不可用于同一天10点预测，周二的真实负荷也不可用。历史记录仍要核对发布延迟。</desc><rect width="1200" height="740" rx="24" fill="#f6f9fc"/><text x="58" y="73" font-family="sans-serif" font-size="37" font-weight="bold" fill="#1f3d5b">as-of：未来时间不等于未来信息</text><text x="60" y="114" font-family="sans-serif" font-size="20" fill="#6a819a">任务：周一 10:00 预测周二 00:00—23:00；每一列按首次公开时间裁决</text><g font-family="sans-serif"><rect x="65" y="176" width="1020" height="70" rx="15" fill="#dcecf8"/><text x="91" y="222" font-size="22" fill="#1c5b8f">时间轴</text><line x1="245" y1="212" x2="1022" y2="212" stroke="#698eae" stroke-width="4"/><circle cx="420" cy="212" r="12" fill="#4b9d78"/><circle cx="633" cy="212" r="14" fill="#2f68a5"/><circle cx="840" cy="212" r="12" fill="#d59b5d"/><text x="365" y="188" font-size="17" fill="#427958">周一 06:00</text><text x="582" y="188" font-size="17" fill="#245a97">预测 10:00</text><text x="795" y="188" font-size="17" fill="#a9773e">周一 12:00</text><rect x="65" y="298" width="320" height="93" rx="16" fill="#e2f3e9" stroke="#7fbe98" stroke-width="2"/><text x="94" y="337" font-size="24" font-weight="bold" fill="#286c46">合法：06点预报</text><text x="94" y="367" font-size="17" fill="#548467">已在预测前发布的未来天气</text><rect x="436" y="298" width="320" height="93" rx="16" fill="#fff0dc" stroke="#d6ae79" stroke-width="2"/><text x="465" y="337" font-size="24" font-weight="bold" fill="#895a25">非法：12点修订版</text><text x="465" y="367" font-size="17" fill="#a47945">在预测后才能取得的预报</text><rect x="807" y="298" width="320" height="93" rx="16" fill="#fde7e6" stroke="#cf908a" stroke-width="2"/><text x="836" y="337" font-size="24" font-weight="bold" fill="#9f4742">非法：周二实际值</text><text x="836" y="367" font-size="17" fill="#aa6e69">真实负荷 / 最终实时价未发生</text><rect x="65" y="444" width="1062" height="148" rx="20" fill="#e9eff5"/><text x="100" y="490" font-size="25" font-weight="bold" fill="#2a4b68">关键判断不看数据表里有没有这个字段，而看版本什么时候可得</text><text x="100" y="530" font-size="20" fill="#5a738a">过去发生却迟报的数据也不一定可用；预测起点之后发布的修订值不能回填到历史回测。</text><text x="100" y="559" font-size="20" fill="#5a738a">合法输入与输入对预测真正有用是两个独立问题。</text><rect x="65" y="637" width="1062" height="55" rx="12" fill="#223f5e"/><text x="94" y="673" font-size="21" font-weight="bold" fill="#fff">模型支持未来协变量 ≠ 可以读取未来真实结果。必须执行历史版本筛选。</text></g></svg>