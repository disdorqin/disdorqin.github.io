<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">作品与引用身份分层</title><desc id="desc">作品、库条目、引用键、附件、批注和人工笔记分开识别。变更时根据不同身份检查受影响关系。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#33576b"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#183347;font-size:22px}.h{font-size:32px;font-weight:700}.sub{font-size:20px;fill:#465f70}.label{font-weight:700;font-size:25px}.small{font-size:19px}.line{fill:none;stroke:#33576b;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#aec4ce;stroke-width:2}</style><rect width="1200" height="800" fill="#f2f6f8"/><text x="48" y="58" class="h">一个题名，不能承担所有身份</text><text x="48" y="96" class="sub">教学代号仅用于说明；实际条目键和附件地址必须从本机取得。</text><rect x="48" y="140" width="340" height="410" rx="16" fill="#e3f0f6" stroke="#aec4ce" stroke-width="2"/><text x="72" y="184" class="label">作品层：研究成果是什么</text><text x="72" y="229" class="">作品标识＋版本说明</text><text x="72" y="285" class="">文献甲：预印本</text><text x="72" y="325" class="">文献甲：正式出版稿</text><text x="72" y="390" class="label">主题相近 ≠ 字节相同</text><text x="72" y="440" class="small">页码、图号、段落可能变化</text><text x="72" y="485" class="small">标识符不能替代附件版本</text><rect x="438" y="140" width="330" height="190" rx="16" fill="#e8f2e9" stroke="#aec4ce" stroke-width="2"/><text x="462" y="184" class="label">库条目与引用键</text><text x="462" y="229" class="">条目标识：本库定位</text><text x="462" y="272" class="">引用键：写作与导出</text><text x="462" y="309" class="small">改键时保留旧键 → 新键映射</text><rect x="438" y="370" width="330" height="180" rx="16" fill="#fff0d9" stroke="#aec4ce" stroke-width="2"/><text x="462" y="413" class="label">附件与批注</text><text x="462" y="455" class="">附件版本＋批注定位</text><text x="462" y="498" class="small">印刷页码 ≠ 阅读器页序</text><rect x="818" y="140" width="334" height="410" rx="16" fill="#ede9f6" stroke="#aec4ce" stroke-width="2"/><text x="842" y="184" class="label">人工笔记身份</text><text x="842" y="232" class="">稳定代号：LIT-0042</text><text x="842" y="282" class="">显示题名：可改善</text><text x="842" y="326" class="">文件路径：可迁移</text><text x="842" y="390" class="small">别名 ≠ 普通字符串链接</text><text x="842" y="435" class="small">重命名后检查真实入链</text><text x="842" y="480" class="small">不能只检查搜索是否命中</text><path d="M388 235H432" class="line"/><path d="M603 330V364" class="line"/><path d="M768 235H812" class="line"/><path d="M768 460H812" class="line"/><rect x="48" y="605" width="1104" height="145" rx="16" fill="#fff" stroke="#aec4ce" stroke-width="2"/><text x="72" y="646" class="label">变更传播检查</text><text x="72" y="688" class="sub">改题名：通常只改显示层　｜　改引用键：检查写作、导出与笔记中的旧键</text><text x="72" y="725" class="sub">换附件：重核定位与版本　｜　改笔记路径：检查内部链接与块引用</text></svg>