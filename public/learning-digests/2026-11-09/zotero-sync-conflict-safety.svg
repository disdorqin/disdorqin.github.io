<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">同步和恢复边界</title><desc id="desc">本地活动数据经核验后受控传输，独立恢复副本保护历史。冲突时先保存双方再比较，避免错误继续传播。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#33576b"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#183347;font-size:22px}.h{font-size:32px;font-weight:700}.sub{font-size:20px;fill:#465f70}.label{font-weight:700;font-size:25px}.small{font-size:19px}.line{fill:none;stroke:#33576b;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#aec4ce;stroke-width:2}</style><rect width="1200" height="800" fill="#f2f6f8"/><text x="48" y="58" class="h">同步传播状态；备份恢复过去</text><text x="48" y="96" class="sub">传输成功不等于一致性正确，也不等于能够撤销误改。</text><rect x="48" y="145" width="520" height="290" rx="16" fill="#e3f0f6" stroke="#aec4ce" stroke-width="2"/><text x="72" y="188" class="label">本地主工作区</text><text x="72" y="233" class="">活动文献数据：由应用管理一致性</text><text x="72" y="279" class="">人工笔记：保留来源、版本与判断</text><text x="72" y="325" class="">生成输出：独立目录，可重新生成</text><text x="72" y="381" class="small">不要把任意云盘当作活动数据库同步器</text><rect x="680" y="145" width="472" height="290" rx="16" fill="#e8f2e9" stroke="#aec4ce" stroke-width="2"/><text x="704" y="188" class="label">受控跨端传输</text><text x="704" y="233" class="">应用同步：先核实支持范围</text><text x="704" y="279" class="">云端工作区：只接收选择过的输出</text><text x="704" y="325" class="">第二设备：核对题录、附件和批注</text><text x="704" y="381" class="small">同步状态与文件可用性分别检查</text><path d="M574 265H674" class="line"/><text x="580" y="244" class="small">核验</text><rect x="48" y="505" width="520" height="230" rx="16" fill="#fff0d9" stroke="#aec4ce" stroke-width="2"/><text x="72" y="548" class="label">独立恢复副本</text><text x="72" y="591" class="">明确时间点＋一致性快照</text><text x="72" y="634" class="">误删不应立刻覆盖此副本</text><text x="72" y="677" class="">实际演练：恢复笔记、附件与链接</text><path d="M310 440V499" class="line"/><text x="330" y="477" class="small">保存快照</text><rect x="680" y="505" width="472" height="230" rx="16" fill="#f5e6e8" stroke="#aec4ce" stroke-width="2"/><text x="704" y="548" class="label">出现冲突时</text><text x="704" y="591" class="">① 暂停继续传播，保存双方副本</text><text x="704" y="634" class="">② 比较身份、版本与新增内容</text><text x="704" y="677" class="">③ 恢复或合并后，再核对定位</text><path d="M916 440V499" class="line"/></svg>